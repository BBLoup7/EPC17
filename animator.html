<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPC17 - Live Animator | Broadcast Dashboard</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- GSAP Animation Library -->
    <script src="js/logger.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <!-- Socket.IO (will be served by Flask-SocketIO if available) -->
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at center, rgba(255, 96, 56, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 20% 80%, rgba(74, 144, 226, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                        var(--bg-primary);
        }

        /* Broadcast Header */
        .broadcast-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: linear-gradient(135deg, rgba(26, 26, 58, 0.95), rgba(10, 10, 46, 0.95));
            border-bottom: 3px solid var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 1000;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        
        .home-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(255, 96, 56, 0.4);
        }
        
        .home-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 96, 56, 0.6);
        }
        
        .event-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), #4a90e2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 96, 56, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        
        .race-info {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .race-timer {
            font-variant-numeric: tabular-nums;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            background: linear-gradient(135deg, rgba(255, 96, 56, 0.2), rgba(74, 144, 226, 0.2));
            border: 2px solid rgba(255, 96, 56, 0.5);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(255, 96, 56, 0.3);
        }
        
        .race-timer .label {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-right: 0.5rem;
            font-size: 0.9rem;
        }

        /* Main Layout */
        .animator-layout {
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            gap: 1.5rem;
            padding: 1.5rem;
            margin-top: 70px;
            height: calc(100vh - 70px);
            box-sizing: border-box;
        }

        /* Panel Styles */
        .panel {
            background: linear-gradient(135deg, rgba(26, 26, 58, 0.9), rgba(10, 10, 46, 0.9));
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            overflow-y: auto;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        
        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), #4a90e2, #8b5cf6);
            border-radius: 20px 20px 0 0;
        }
        
        .panel h3 {
            margin: 0 0 1.5rem 0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Next Races Panel */
        .next-races-panel {
            display: flex;
            flex-direction: column;
        }

        .next-races-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .mini-race {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.3s ease;
        }

        .mini-race:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 96, 56, 0.2);
        }

        .mini-race .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .mini-race .title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .mini-race .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(255, 96, 56, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-weight: 600;
        }

        .mini-race .lanes {
            display: flex;
            gap: 0.5rem;
        }

        .mini-race .lanes.horizontal {
            flex-direction: row;
        }

        .mini-race .lanes.vertical {
            flex-direction: column;
        }

        .lane-horizontal, .lane-vertical {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            flex: 1;
        }

        .lane-number {
            background: var(--accent-primary);
            color: white;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            min-width: 32px;
            text-align: center;
        }

        .driver-name {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Current Race Center Panel */
        .current-race-center {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(26, 26, 58, 0.85), rgba(10, 10, 46, 0.85));
            border: 3px solid var(--accent-primary);
            box-shadow: 0 0 50px rgba(255, 96, 56, 0.4), inset 0 0 100px rgba(255, 96, 56, 0.05);
        }

        .cards-row {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 1.5rem;
            padding: 2rem;
            width: 100%;
            flex-wrap: wrap;
        }

        .driver-card {
            position: relative;
            width: clamp(280px, 28vw, 450px);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .driver-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .lane-accent {
            position: absolute;
            inset: 0;
            border-radius: 24px;
            pointer-events: none;
            opacity: 0.6;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        /* Lane-specific colors */
        .lane-1 .lane-accent {
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.5), 0 0 40px rgba(74, 144, 226, 0.4) inset;
        }
        .lane-2 .lane-accent {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.5), 0 0 40px rgba(239, 68, 68, 0.4) inset;
        }
        .lane-3 .lane-accent {
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.5), 0 0 40px rgba(251, 191, 36, 0.4) inset;
        }
        .lane-4 .lane-accent {
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.5), 0 0 40px rgba(139, 92, 246, 0.4) inset;
        }
        .lane-5 .lane-accent {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.5), 0 0 40px rgba(16, 185, 129, 0.4) inset;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.9; }
        }

        .driver-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.75rem;
        }

        .driver-name {
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            font-size: clamp(1.6rem, 3vw, 2.8rem);
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .lane-badge {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-primary);
            background: rgba(255, 96, 56, 0.2);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
        }

        .driver-sub {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .driver-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .stat {
            background: linear-gradient(135deg, rgba(255, 96, 56, 0.25), rgba(74, 144, 226, 0.25));
            border: 1px solid rgba(255, 96, 56, 0.4);
            color: #ffffff;
            padding: 1rem;
            border-radius: 14px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat:hover {
            background: linear-gradient(135deg, rgba(255, 96, 56, 0.35), rgba(74, 144, 226, 0.35));
            transform: translateY(-3px);
        }

        .stat .v {
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--accent-primary);
            font-family: 'Outfit', sans-serif;
        }

        .stat .k {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Previous Races Panel */
        .prev-races {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .prev-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .prev-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .prev-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-primary);
            box-shadow: 0 6px 20px rgba(255, 96, 56, 0.2);
        }

        .prev-card .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .prev-card .title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .prev-card .time {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: rgba(255, 96, 56, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }

        .prev-card .lanes {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .prev-card .p {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            transition: all 0.3s ease;
        }

        .prev-card .p:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .prev-card .p.winner {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 96, 56, 0.25));
            border: 1px solid rgba(255, 215, 0, 0.4);
        }

        .prev-card .p.second {
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.25), rgba(255, 96, 56, 0.15));
            border: 1px solid rgba(192, 192, 192, 0.4);
        }

        .prev-card .p.third {
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.25), rgba(255, 96, 56, 0.15));
            border: 1px solid rgba(205, 127, 50, 0.4);
        }

        .prev-card .position {
            color: var(--accent-primary);
            font-weight: 700;
            font-size: 1rem;
            min-width: 40px;
            text-align: center;
        }

        .prev-card .driver-info {
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            flex: 1;
            margin-left: 0.75rem;
        }

        .prev-card .trophy {
            font-size: 1.2rem;
        }

        /* Overlays */
        .race-complete-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.95), rgba(74, 144, 226, 0.95));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
        }

        .overlay-content {
            text-align: center;
        }

        .overlay-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            margin-bottom: 1rem;
        }

        .overlay-subtitle {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .overlay-winner {
            font-size: 1.4rem;
            font-weight: 500;
        }

        .race-results-display {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(26, 26, 58, 0.98), rgba(10, 10, 46, 0.98));
            border: 3px solid var(--accent-primary);
            border-radius: 20px;
            padding: 2rem;
            z-index: 100;
            color: white;
            overflow-y: auto;
        }

        .results-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .results-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--accent-primary);
            text-shadow: 0 0 20px rgba(255, 96, 56, 0.5);
        }

        .results-subtitle {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            transition: all 0.3s ease;
        }

        .result-row:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .result-row.winner {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 96, 56, 0.25));
            border: 2px solid rgba(255, 215, 0, 0.5);
        }

        .result-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .result-position {
            background: var(--accent-primary);
            color: white;
            padding: 0.5rem 0.8rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 60px;
            text-align: center;
        }

        .result-driver {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .result-trophy {
            font-size: 1.8rem;
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem 1rem;
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .animator-layout {
                grid-template-columns: 280px 1fr 320px;
            }
        }

        @media (max-width: 1100px) {
            .animator-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg"></div>

    <!-- Broadcast Header -->
    <div class="broadcast-header">
        <div class="header-left">
            <a href="index.html" class="home-button" title="Go to Home">
                <i class="fas fa-home"></i>
            </a>
            <h1 class="event-title" id="event-name">Loading...</h1>
        </div>
        <div class="header-right">
            <div class="race-info" id="races-left">—</div>
            <div class="race-timer">
                <span class="label">Since last race:</span>
                <span class="t">00:00:00</span>
            </div>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="animator-layout">
        <!-- Left Panel: Next 3 Races -->
        <aside class="panel next-races-panel">
            <h3><i class="fas fa-clock"></i> Up Next</h3>
            <div id="next-races" class="next-races-list">
                <div class="empty-state">Loading races...</div>
            </div>
        </aside>

        <!-- Center Panel: Current Race -->
        <section class="panel current-race-center">
            <div id="cardsHost" class="cards-row">
                <div class="empty-state">Loading current race...</div>
            </div>
        </section>

        <!-- Right Panel: Previous 3 Races -->
        <aside class="panel previous-races-panel">
            <h3><i class="fas fa-flag-checkered"></i> Recent Results</h3>
            <div id="prev-races" class="prev-races">
                <div class="empty-state">Loading results...</div>
            </div>
        </aside>
    </div>

    <!-- Core Dependencies -->
    <script src="utils/performance-monitor.js"></script>
    <script src="utils/ui-components.js"></script>
    <script src="utils/auth.js"></script>
    <script src="utils/data-manager.js"></script>
    <script src="utils/event-bus.js"></script>

    <!-- Animator Modules -->
    <script src="modules/animator-utils.js"></script>
    <script src="modules/animator-renderer.js"></script>
    <script src="modules/animator-controller.js"></script>

    <!-- Initialization -->
    <script>
        // Initialize the Animator Controller when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎬 Animator Page Loading...');
            
            // Wait for dependencies to load
            let attempts = 0;
            while ((!window.AnimatorController || !window.AnimatorRenderer || !window.AnimatorUtils) && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            
            if (!window.AnimatorController) {
                console.error('❌ Failed to load Animator modules');
                return;
            }
            
            // Create and initialize controller
            const controller = new window.AnimatorController();
            await controller.init();
            
            // Store globally for debugging
            window.animatorController = controller;
            
            console.log('✅ Animator Page Ready');
            console.log('⌨️ Keyboard Controls:');
            console.log('  - Space: Skip to next race');
            console.log('  - R: Refresh data');
            console.log('  - F: Toggle fullscreen');
            console.log('  - ESC: Clear overlays');
        });
    </script>
</body>
</html>
