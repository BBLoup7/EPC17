    <script src="utils/ui-components.js"></script>
    <!-- Export libs -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="utils/exporter.js"></script>
     
     <!-- Mobile Navigation -->
     <script src="js/mobile-nav.js"></script>
     <script>
        // Load all data using DataManager
        async function loadAllData() {
            try {
                // Initialize DataManager if not already done
                if (!dataManager) {
                    dataManager = new DataManager();
                    // Load all required data types including participants
                    await dataManager.loadFromStorage(['series', 'events', 'race-brackets', 'participants']);
                }
                
                // Set up real-time event listeners
                setupEventListeners();
                
                // Get data from DataManager (synced with other pages)
                allData.participants = dataManager.getParticipantsArray();
                allData.events = dataManager.getEventsArray();
                allData.series = dataManager.getAllSeries();
                
                // Load bracket data to extract race results
                allData.raceBrackets = dataManager.data.raceBrackets || {};
                
                // Extract race history from brackets for all participants
                allData.races = extractRaceHistoryFromBrackets();
                console.log(`📊 Extracted ${allData.races.length} race records from bracket data`);
                
                // Achievements removed

                populateDriverSelect();
                displayDriverGrid();
                
                console.log('📊 Statistics Manager:', dataManager.statisticsManager ? 'Active' : 'Not Available');
                console.log('📡 Event Bus:', dataManager.eventBus ? 'Active' : 'Not Available');
                console.log('📋 Driver Profile Data Summary:', {
                    participants: allData.participants.length,
                    events: allData.events.length,
                    races: allData.races.length
                });
            } catch (error) {
                console.error('Error loading data:', error);
                showToast('Error loading driver data', 'error');
            }
        }

        // Add export controls once DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            addDriverExportButtons();
        });

        function addDriverExportButtons() {
            const headerActions = document.querySelector('.page-header .header-actions');
            if (!headerActions || document.getElementById('driverExportPdf')) return;

            const btnPdf = document.createElement('button');
            btnPdf.id = 'driverExportPdf';
            btnPdf.className = 'btn btn-secondary btn-sm';
            btnPdf.title = 'Export page to PDF';
            btnPdf.innerHTML = '<i class="fas fa-file-pdf"></i>';
            btnPdf.onclick = () => exportDriverProfile('pdf');

            const btnPng = document.createElement('button');
            btnPng.id = 'driverExportPng';
            btnPng.className = 'btn btn-secondary btn-sm';
            btnPng.title = 'Export page to PNG';
            btnPng.style.marginLeft = '8px';
            btnPng.innerHTML = '<i class="fas fa-image"></i>';
            btnPng.onclick = () => exportDriverProfile('png');

            headerActions.appendChild(btnPdf);
            headerActions.appendChild(btnPng);
        }

        async function exportDriverProfile(format) {
            try {
                const main = document.querySelector('main');
                const driverNameEl = document.getElementById('driverName');
                const driverName = driverNameEl && driverNameEl.textContent ? driverNameEl.textContent.trim().toLowerCase().replace(/\s+/g, '-') : 'driver-profile';
                const prefix = selectedEventId ? `${driverName}-event` : driverName;
                const name = (window.ExportUtils && ExportUtils.defaultFileName(prefix)) || prefix;
                if (!main) return;
                if (window.ExportUtils && typeof ExportUtils.ensureDependencies === 'function') {
                    await ExportUtils.ensureDependencies();
                }
                UIComponents && UIComponents.showLoadingOverlay && UIComponents.showLoadingOverlay('Rendering export...');
                await new Promise(r => setTimeout(r, 50));
                if (format === 'pdf') {
                    await ExportUtils.exportElementAsPDF(main, `${name}.pdf`, { orientation: 'p', format: 'a4', marginMm: 5, scale: 2 });
                } else if (format === 'png') {
                    await ExportUtils.exportElementAsPNG(main, `${name}.png`, 2);
                }
            } catch (e) {
                console.error('Export failed', e);
                showToast('Export failed. See console for details.', 'error');
            } finally {
                UIComponents && UIComponents.hideLoadingOverlay && UIComponents.hideLoadingOverlay();
            }
        }
