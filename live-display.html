<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPC TECHNOLOGY - Live Display</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Hero Section Styles - Consistent with Series Page */
        .hero-section {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-radius: 12px;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-text {
            flex: 1;
        }

        .hero-title {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-orange-warm) 0%, var(--accent-orange-glow) 50%, var(--accent-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 500px;
            line-height: 1.5;
        }

        .hero-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-hero {
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-orange-warm), var(--accent-orange-glow)) !important;
            box-shadow: 0 6px 20px rgba(255, 140, 66, 0.4) !important;
            transition: all 0.3s ease;
        }

        .btn-hero:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 140, 66, 0.5) !important;
            background: linear-gradient(135deg, var(--accent-orange-glow), var(--accent-orange-warm)) !important;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.875rem 1.5rem;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            border-color: var(--accent-orange-warm);
            color: var(--accent-orange-warm);
            background: rgba(255, 140, 66, 0.1);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-section {
                padding: 1.5rem 1rem;
                margin-bottom: 1rem;
            }
            
            .hero-content {
                flex-direction: column;
                gap: 1.5rem;
                text-align: center;
            }
            
            .hero-title {
                font-size: 1.75rem;
            }
            
            .hero-subtitle {
                font-size: 1rem;
            }
            
            .hero-actions {
                flex-direction: column;
                width: 100%;
            }
            
            .btn-hero,
            .btn-outline {
                width: 100%;
                justify-content: center;
            }
        }

        /* Live Display Specific Styles */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #030217 0%, #0a0a2e 50%, #1a1a3a 100%);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            color: var(--text-primary);
        }

        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            overflow-x: hidden;
        }

        .live-display-container {
            display: grid;
            grid-template-rows: auto 1fr;
            height: 100vh;
            width: 100vw;
            gap: 0;
            margin: 0;
            padding: 0;
        }

        /* Compact Header */
        .header-section {
            background: rgba(10, 10, 46, 0.95);
            border-bottom: 2px solid var(--accent-primary);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 50px;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Sneaky Back Button */
        .back-button {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background: rgba(74, 144, 226, 0.2);
            border: 1px solid rgba(74, 144, 226, 0.3);
            color: var(--accent-primary);
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
            opacity: 0.7;
            z-index: 10;
        }

        .back-button:hover {
            background: rgba(74, 144, 226, 0.3);
            border-color: rgba(74, 144, 226, 0.5);
            opacity: 1;
            transform: scale(1.05);
        }

        .back-button:active {
            transform: scale(0.95);
        }

        .event-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .event-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .event-subtitle {
            font-size: 0.8rem;
            color: var(--accent-primary);
            font-weight: 500;
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 0.3rem 0.6rem;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.75rem;
            animation: pulse 2s infinite;
        }

        .refresh-indicator {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Main Content - 3 Column Layout (FULL WIDTH) */
        .main-content {
            display: grid;
            grid-template-columns: 1.3fr 1.3fr 0.8fr;
            height: 100%;
            width: 100vw;
            gap: 1px;
            background: var(--border-color);
            margin: 0 auto;
            padding: 0;
            max-width: 1800px;
            justify-content: center;
        }

        .content-section {
            background: rgba(3, 2, 23, 0.95);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow: hidden;
            min-width: 0;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .section-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
        }

        /* Upcoming Races Section */
        .upcoming-section .section-icon {
            background: linear-gradient(135deg, var(--warning), #d97706);
        }

        /* Recent Results Section */
        .results-section .section-icon {
            background: linear-gradient(135deg, var(--success), #059669);
        }

        /* Stats Section */
        .stats-section .section-icon {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        /* Driver Profile Section */
        .profile-section .section-icon {
            background: linear-gradient(135deg, #ec4899, #db2777);
        }

        /* Race Cards - WIDE Horizontal Layout */
        .races-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .races-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.3rem;
            padding: 0.25rem;
        }

        .race-card {
            background: rgba(26, 26, 58, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.4rem 0.4rem 0.6rem 0.4rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: 70px;
            max-height: 80px;
        }

        .race-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        .race-card.completed::before {
            background: linear-gradient(90deg, var(--success), #059669);
        }

        .race-card.upcoming::before {
            background: linear-gradient(90deg, var(--warning), #d97706);
        }

        .race-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .race-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            flex: 1;
        }
        
        .race-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
        }

        .race-status {
            padding: 0.15rem 0.4rem;
            border-radius: 8px;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .race-status.completed {
            background: var(--success);
            color: white;
        }

        .race-status.upcoming {
            background: var(--warning);
            color: white;
        }

        .race-info {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
            font-size: 0.6rem;
        }

        .race-class {
            color: var(--accent-primary);
            font-weight: 600;
        }

        .race-bracket {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .race-participants {
            display: flex;
            flex-direction: row;
            gap: 0.3rem;
            margin-top: 0.2rem;
            flex-wrap: nowrap;
        }

        .participant {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.2rem 0.3rem 0.3rem 0.3rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            font-size: 0.65rem;
            min-width: 100px;
            flex: 1;
        }

        .participant-info {
            display: flex;
            align-items: center;
            gap: 0.15rem;
            flex: 1;
        }

        .participant-lane {
            background: var(--accent-primary);
            color: white;
            padding: 0.1rem 0.35rem;
            border-radius: 2px;
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.1;
        }

        .participant-name {
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            font-size: 0.9rem;
            line-height: 1.1;
        }

        .participant-position {
            font-weight: 700;
            color: var(--accent-primary);
            font-size: 0.98rem;
            line-height: 1.1;
        }

        .participant.winner .participant-position {
            color: var(--success);
        }

        .participant.winner .participant-lane {
            background: var(--success);
        }

        .participant.winner {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .participant.winner .participant-name {
            font-weight: 700;
            color: #d4af37;
        }
        .participant.winner .winner-badge {
            margin-left: 0.3em;
            color: #d4af37;
            font-size: 0.9em;
            vertical-align: middle;
        }

        /* Race Groups */
        .race-group {
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .group-header {
            background: rgba(26, 26, 58, 0.9);
            padding: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .group-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .group-count {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
        }

        .group-races {
            padding: 0.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.3rem;
        }

        /* Stats Panel */
        .stats-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 45vh;
            overflow-y: hidden;
        }

        .stat-box {
            background: rgba(26, 26, 58, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box.active {
            border-color: var(--accent-primary);
            box-shadow: 0 2px 8px rgba(74, 144, 226, 0.3);
        }

        .stat-title {
            font-size: 0.6rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-primary);
            margin-bottom: 0.25rem;
        }

        .stat-description {
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        /* Progress visuals */
        .stat-progress {
            background: rgba(26, 26, 58, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.65rem 0.75rem;
        }
        .progress-title {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .progress-main {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }
        .progress-percent {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent-primary);
        }
        .progress-subtext {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .progress-bar {
            height: 8px;
            width: 100%;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transition: width 0.4s ease;
        }
        .stat-pages { display: grid; gap: 0.5rem; }
        .stat-page { display: none; }
        .stat-page.active { display: block; }

        .top-drivers {
            background: rgba(26, 26, 58, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 0.5rem 0.25rem 0.5rem;
        }

        .top-drivers-title {
            margin: 0 0 0.4rem 0;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .top-driver-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            padding: 0.2rem 0.15rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .top-driver-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
        }

        .top-driver-wins {
            color: var(--accent-primary);
            font-weight: 700;
            margin-left: 0.5rem;
        }

        /* Driver Profile */
        .driver-profile {
            background: rgba(26, 26, 58, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            text-align: center;
            margin-top: 1rem;
            position: sticky;
            top: 0;
            overflow: hidden;
            min-height: 155px;
        }
        .driver-profile-inner { will-change: transform, opacity; }
        .driver-profile-inner.slide-in { animation: scrollIn 420ms ease both; }
        @keyframes scrollIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .driver-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.5rem;
            font-size: 1rem;
            color: white;
            font-weight: 700;
        }

        .driver-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .driver-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .driver-stat {
            text-align: center;
        }

        .driver-stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .driver-stat-label {
            font-size: 0.55rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* No data message */
        .no-data-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            height: 100%;
        }

        .no-data-message i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            opacity: 0.5;
        }

        .no-data-message h3 {
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }

        .no-data-message p {
            font-size: 0.75rem;
            margin: 0;
        }

        /* Scrollbar styling */
        .races-container::-webkit-scrollbar {
            width: 3px;
        }

        .races-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .races-container::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 2px;
        }

        /* Responsive adjustments */
        @media (min-width: 1920px) {
            .event-title {
                font-size: 1.5rem;
            }
            
            .section-title {
                font-size: 1.3rem;
            }
            
            .race-title {
                font-size: 1rem;
            }
            
            .stat-value {
                font-size: 1.6rem;
            }
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            /* Adjust live display layout for mobile */
            .live-display-container {
                grid-template-rows: auto 1fr;
                height: 100vh;
                margin-top: 0;
            }
            
            /* Single column layout on mobile */
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                gap: 0.5rem;
                padding: 0.5rem;
            }
            
            .content-section {
                padding: 0.75rem;
                min-height: auto;
            }
            
            /* Compact header for mobile */
            .header-section {
                padding: 0.5rem 1rem;
                min-height: 40px;
            }
            
            .event-title {
                font-size: 1.1rem;
            }
            
            .event-subtitle {
                font-size: 0.7rem;
            }
            
            /* Adjust race cards for mobile */
            .race-card {
                padding: 0.3rem 0.3rem 0.5rem 0.3rem;
                min-height: 60px;
                max-height: 70px;
            }
            
            .race-title {
                font-size: 0.75rem;
            }
            
            .participant {
                padding: 0.15rem 0.25rem 0.25rem 0.25rem;
                font-size: 0.6rem;
                min-width: 80px;
            }
            
            .participant-name {
                font-size: 0.7rem;
            }
            
            .participant-lane {
                font-size: 0.55rem;
                padding: 0.05rem 0.2rem;
            }
            
            /* Adjust stats for mobile */
            .stat-box {
                padding: 0.5rem;
            }
            
            .stat-title {
                font-size: 0.6rem;
            }
            
            .stat-value {
                font-size: 1.2rem;
            }
            
            .stat-description {
                font-size: 0.55rem;
            }
            
            /* Adjust driver profile for mobile */
            .driver-profile {
                padding: 0.5rem;
                margin-top: 0.5rem;
            }
            
            .driver-avatar {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }
            
            .driver-name {
                font-size: 0.8rem;
            }
            
            .driver-stat-value {
                font-size: 0.9rem;
            }
            
            .driver-stat-label {
                font-size: 0.5rem;
            }
            
            /* Adjust section headers for mobile */
            .section-header {
                margin-bottom: 0.5rem;
            }
            
            .section-title {
                font-size: 1rem;
            }
            
            .section-icon {
                width: 20px;
                height: 20px;
                font-size: 0.7rem;
            }
            
            /* Adjust group headers for mobile */
            .group-header {
                padding: 0.4rem 0.6rem;
                font-size: 0.75rem;
                margin-top: 0.4rem;
                margin-bottom: 0.15rem;
            }
            
            /* Hide back button on mobile when nav is open */
            body.nav-open .back-button {
                opacity: 0.3;
                pointer-events: none;
            }
        }

        /* Small mobile devices */
        @media (max-width: 480px) {
            .live-display-container {
                margin-top: 0;
                height: 100vh;
            }
            
            .header-section {
                padding: 0.4rem 0.8rem;
                min-height: 35px;
            }
            
            .event-title {
                font-size: 1rem;
            }
            
            .main-content {
                padding: 0.3rem;
                gap: 0.3rem;
            }
            
            .content-section {
                padding: 0.5rem;
            }
            
            .race-card {
                min-height: 55px;
                max-height: 65px;
            }
            
            .participant {
                min-width: 70px;
                font-size: 0.55rem;
            }
            
            .participant-name {
                font-size: 0.65rem;
            }
        }

        /* Animation for stat transitions */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-box {
            animation: fadeInUp 0.3s ease-out;
        }

        /* Add subtle color separation for group headers */
        .group-header {
            background: rgba(26, 26, 58, 0.92);
            padding: 0.5rem 0.7rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-primary);
            border-radius: 6px 6px 0 0;
            margin-top: 0.55rem;
            margin-bottom: 0.2rem;
            border-left: 4px solid var(--accent-primary);
        }
        
        /* Visual differences for bracket types */
        .group-header[data-bracket="upper"] {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }
        
        .group-header[data-bracket="lower"] {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }
        
        .group-header[data-bracket="final"] {
            border-left-color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
        }
        
        /* Visual separation between classes - only show when class changes */
        .group-header[data-class="1"]:not(.same-class-as-previous) {
            border-top: 3px solid rgba(59, 130, 246, 0.8);
            margin-top: 1rem;
        }
        
        .group-header[data-class="2"]:not(.same-class-as-previous) {
            border-top: 3px solid rgba(239, 68, 68, 0.8);
            margin-top: 1rem;
        }
        
        .group-header[data-class="3"]:not(.same-class-as-previous) {
            border-top: 3px solid rgba(245, 158, 11, 0.8);
            margin-top: 1rem;
        }
        
        .group-header[data-class="4"]:not(.same-class-as-previous) {
            border-top: 3px solid rgba(147, 51, 234, 0.8);
            margin-top: 1rem;
        }
        
        .group-header[data-class="5"]:not(.same-class-as-previous) {
            border-top: 3px solid rgba(34, 197, 94, 0.8);
            margin-top: 1rem;
        }
        
        .group-separator {
            height: 0.25rem;
        }
    </style>
</head>
<body>


    <div class="live-display-container">
        <!-- Hero Section -->
        <div class="hero-section">
            <div class="hero-content">
                <div class="hero-text">
                    <h1 class="hero-title" id="event-title">Loading Event...</h1>
                    <p class="hero-subtitle" id="event-subtitle">Live Display - Real-time race tracking and results</p>
                </div>
                <div class="hero-actions">
                    <button class="back-button" onclick="window.history.back()" title="Go Back">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <button class="btn btn-primary btn-hero" onclick="refreshDisplay()">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                    <button class="btn btn-outline" onclick="toggleFullscreen()">
                        <i class="fas fa-expand"></i> Fullscreen
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content - 3 Column Layout (FULL WIDTH) -->
        <div class="main-content">
            <!-- Upcoming Races -->
            <div class="content-section upcoming-section">
                <div class="section-header">
                    <div class="section-icon">
                        <i class="fas fa-flag-checkered"></i>
                    </div>
                    <h2 class="section-title">Upcoming Races</h2>
                </div>
                <div class="races-container" id="upcoming-races">
                    <div class="races-grid" id="upcoming-races-grid">
                        <!-- Upcoming races will be populated here -->
                    </div>
                </div>
            </div>

            <!-- Recent Results -->
            <div class="content-section results-section">
                <div class="section-header">
                    <div class="section-icon">
                        <i class="fas fa-trophy"></i>
                    </div>
                    <h2 class="section-title">Recent Results</h2>
                </div>
                <div class="races-container" id="recent-results">
                    <div class="races-grid" id="recent-results-grid">
                        <!-- Recent race results will be populated here -->
                    </div>
                </div>
            </div>

            <!-- Stats & Profile -->
            <div class="content-section stats-section">
                <div class="section-header">
                    <div class="section-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <h2 class="section-title">Stats & Profile</h2>
                </div>
                <div class="stats-container" id="stats-container">
                    <!-- Statistics will be populated here -->
                </div>
                <div class="driver-profile" id="driver-profile">
                    <!-- Driver profile will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/logger.js"></script>
    <script src="utils/performance-monitor.js"></script>
    <script src="utils/ui-components.js"></script>
    <script src="utils/auth.js"></script>
    <script src="utils/data-manager.js"></script>
    <script src="utils/event-bus.js"></script>
    
    <!-- Event System - Modular Architecture (Refactored) -->
    <script src="modules/event-data-service.js"></script>
    <script src="modules/event-logic.js"></script>
    <script src="modules/event-ui.js"></script>
    <script src="modules/event-controller.js"></script>
    <script src="modules/event.js"></script>
    
    <script src="modules/pairing-engine.js"></script>
    <script src="modules/race.js"></script>
    <script src="js/race-ui.js"></script>
    <script src="js/app.js"></script>
    <script>
        class LiveDisplay {
            constructor() {
                this.refreshInterval = 8000; // 8 seconds for auto-updates
                this.statsRotationInterval = 4000; // 4 seconds
                this.currentStatIndex = 0;
                this.currentStatsPage = 0;
                this.driverRotationIndex = 0;
                this.currentEvent = null;
                this.races = [];
                this.participants = [];
                this.events = [];
                this.raceBrackets = {};
                
                this.init();
            }

            async init() {
                await this.loadData();
                this.setupAutoRefresh();
                this.setupStatsRotation();
                this.setupDriverRotation();
                this.setupEventBusListeners();
                this.renderDisplay();
            }

            async loadData() {
                try {
                    console.log('📡 Loading data for Live Display...');
                    
                    // Load events data first
                    const eventsResult = await window.dataManager.getEvents({}, 1, 1000);
                    this.events = Array.isArray(eventsResult?.events) ? eventsResult.events : (Array.isArray(eventsResult) ? eventsResult : []);
                    console.log('📅 Events loaded:', this.events?.length || 0, 'events');

                    // Load races and race brackets before choosing event
                    const racesData = await window.dataManager.getRaces();
                    this.races = Array.isArray(racesData?.races) ? racesData.races : (Array.isArray(racesData) ? racesData : []);
                    console.log('🏁 Races loaded:', this.races?.length || 0, 'races');

                    this.raceBrackets = await window.dataManager.getRaceBrackets();
                    console.log('🏁 Race brackets loaded for events:', Object.keys(this.raceBrackets || {}).length);

                    // If races array is empty, extract from ALL brackets to include eventId
                    if ((!this.races || this.races.length === 0) && this.raceBrackets) {
                        const extracted = [];
                        Object.entries(this.raceBrackets).forEach(([eventId, bracket]) => {
                            const r = this.extractRacesFromBrackets(bracket, eventId);
                            extracted.push(...r);
                        });
                        this.races = extracted;
                        console.log('🏁 Extracted races from brackets:', this.races?.length || 0, 'races');
                    }

                    // Select event based on most recent race activity (in-progress > completed > scheduled)
                    this.currentEvent = this.findEventFromRaceActivity();
                    if (!this.currentEvent && this.events.length > 0) {
                        this.currentEvent = [...this.events].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
                    }
                    console.log('🎯 Current event:', this.currentEvent?.name || 'None');
                    
                    // Load participants data
                    const participantsResult = await window.dataManager.getParticipants({}, 1, 1000);
                    this.participants = Array.isArray(participantsResult?.participants) ? participantsResult.participants : (Array.isArray(participantsResult) ? participantsResult : []);
                    console.log('👥 Participants loaded:', this.participants?.length || 0, 'participants');
                    
                } catch (error) {
                    console.error('❌ Error loading data:', error);
                    this.events = [];
                    this.races = [];
                    this.participants = [];
                    this.currentEvent = null;
                }
            }

            setupAutoRefresh() {
                setInterval(() => {
                    this.refreshData();
                }, this.refreshInterval);
            }

            setupEventBusListeners() {
                if (window.eventBus && typeof window.eventBus.on === 'function') {
                    window.eventBus.on('race-result-recorded', () => {
                        console.log('🏁 Race result recorded - refreshing live display');
                        this.refreshData();
                        // silent auto-refresh
                    });

                    window.eventBus.on('event-updated', () => {
                        console.log('📅 Event updated - refreshing live display');
                        this.refreshData();
                        // silent auto-refresh
                    });

                    window.eventBus.on('race-bracket-saved', () => {
                        console.log('🏁 Race bracket saved - refreshing live display');
                        this.refreshData();
                        // silent auto-refresh
                    });

                    // Listen for event status updates
                    window.eventBus.on('eventStatusUpdated', (data) => {
                        console.log('🔄 Event status updated - refreshing live display:', data);
                        this.refreshData();
                    });

                    // Listen for event completion
                    window.eventBus.on('eventCompleted', (data) => {
                        console.log('🏁 Event completed - refreshing live display:', data);
                        this.refreshData();
                    });
                    
                    console.log('✅ Event bus listeners registered for real-time updates');
                } else {
                    console.warn('⚠️ Event bus not available for real-time updates');
                }
            }

            async refreshData() {
                // Store the currently selected event ID before refresh
                const currentEventId = this.currentEvent?.id;
                
                // Only refresh the data, don't re-run event selection
                await this.refreshEventData();
                
                // Restore the selected event if it was different from the default
                if (currentEventId && this.currentEvent?.id !== currentEventId) {
                    this.currentEvent = this.events.find(event => event.id === currentEventId);
                    if (this.currentEvent) {
                        // Reduced logging to prevent console spam during frequent refreshes
                        // console.log('🔄 Restored selected event:', this.currentEvent.name);
                    }
                }
                
                this.renderDisplay();
            }

            async refreshEventData() {
                // Refresh only the data files without re-running event selection logic
                try {
                    const [eventsData, racesData, participantsData, bracketsData] = await Promise.all([
                        dataManager.getEvents({}, 1, 1000),
                        dataManager.getRaces(),
                        dataManager.getParticipants({}, 1, 1000),
                        dataManager.getRaceBrackets()
                    ]);
                    
                    // Normalize possible paginated responses → arrays
                    this.events = Array.isArray(eventsData?.events) ? eventsData.events : (Array.isArray(eventsData) ? eventsData : []);
                    this.races = Array.isArray(racesData?.races) ? racesData.races : (Array.isArray(racesData) ? racesData : []);
                    this.participants = Array.isArray(participantsData?.participants) ? participantsData.participants : (Array.isArray(participantsData) ? participantsData : []);
                    this.raceBrackets = bracketsData || [];
                    
                    // If no races from server, extract them from race brackets (same logic as initial load)
                    if ((!this.races || this.races.length === 0) && this.currentEvent) {
                        const raceBrackets = window.dataManager.getRaceBracket(this.currentEvent.id);
                        if (raceBrackets) {
                            this.races = this.extractRacesFromBrackets(raceBrackets);
                            console.log('🔄 Extracted races from brackets during refresh:', this.races?.length || 0, 'races');
                        }
                    }
                    
                    // Reduced logging frequency to prevent console spam
                    // console.log('🔄 Data refreshed - Events:', this.events.length, 'Races:', this.races.length);
                } catch (error) {
                    console.error('Error refreshing data:', error);
                }
            }

            setupStatsRotation() {
                // Keep a stable rotation timer; avoid multiple intervals
                if (this._statsTimer) clearInterval(this._statsTimer);
                this._statsTimer = setInterval(() => {
                    this.rotateStats();
                }, this.statsRotationInterval);
            }

            setupDriverRotation() {
                setInterval(() => {
                    const list = this.getTopDriversList();
                    if (list.length > 0) {
                        this.driverRotationIndex = (this.driverRotationIndex + 1) % list.length;
                        this.renderDriverProfile();
                    }
                }, 6000);
            }

            rotateStats() {
                const pages = document.querySelectorAll('.stat-page');
                if (pages.length === 0) return;

                // Only switch if content actually exists to show (prevents 0.1s flashes)
                pages.forEach((p, idx) => p.classList.toggle('active', idx === this.currentStatsPage));
                this.currentStatsPage = (this.currentStatsPage + 1) % pages.length;
            }

            renderDisplay() {
                this.updateEventHeader();
                
                // Render content immediately without skeleton loading
                this.renderUpcomingRaces();
                this.renderRecentResults();
                this.renderStatistics();
                this.renderDriverProfile();
            }

            updateEventHeader() {
                const titleElement = document.getElementById('event-title');
                const subtitleElement = document.getElementById('event-subtitle');

                if (!this.currentEvent) {
                    if (titleElement) {
                        titleElement.textContent = 'No Active Event';
                    }
                    if (subtitleElement) {
                        subtitleElement.textContent = 'Live Display';
                    }
                    return;
                }

                if (titleElement) {
                    titleElement.textContent = this.currentEvent.name;
                }

                if (subtitleElement) {
                    const status = this.currentEvent.status;
                    const location = this.currentEvent.location;
                    subtitleElement.textContent = `${location} • ${status.charAt(0).toUpperCase() + status.slice(1)}`;
                }
            }

            createRaceCard(race, type) {
                // Get participants from lanes if available, otherwise use participants array
                let participants = [];
                if (race.lanes && Array.isArray(race.lanes)) {
                    participants = race.lanes.map((lane, index) => ({
                        id: lane.participant ? lane.participant.id : null,
                        name: lane.participant ? lane.participant.name : `Empty`,
                        lane: lane.lane || (index + 1),
                        position: race.results && lane.participant ? race.results[lane.participant.id] : null,
                        isEmpty: !lane.participant
                    })).filter(p => !p.isEmpty);
                } else if (race.participants && Array.isArray(race.participants)) {
                    participants = race.participants.map((participantId, index) => {
                        const participant = this.participants.find(p => p.id === participantId);
                        return {
                            id: participantId,
                            name: participant ? participant.name : `Driver ${participantId.slice(-4)}`,
                            lane: index + 1,
                            position: race.results ? race.results[participantId] : null,
                            isEmpty: false
                        };
                    });
                }
                
                // For completed races, sort participants by position
                if (type === 'completed' && participants.length > 0) {
                    console.log('🏁 Race results for race', race.id, ':', race.results);
                    console.log('🏁 Race data structure:', race);
                    
                    // Try different ways to get results
                    let results = race.results || race.raceResults || race.finishOrder || {};
                    console.log('🏁 Extracted results:', results);
                    
                    // Update participant positions with actual results
                    participants.forEach(p => {
                        // Try different ways to find the result
                        let position = results[p.id] || results[p.name] || null;
                        
                        // If no direct match, try to find by participant ID in results
                        if (!position && results.finishOrder) {
                            const finishIndex = results.finishOrder.indexOf(p.id);
                            if (finishIndex !== -1) {
                                position = finishIndex + 1;
                            }
                        }
                        
                        // If still no position, try to find in results array
                        if (!position && Array.isArray(results)) {
                            const resultIndex = results.findIndex(r => r.participantId === p.id || r.participant === p.id);
                            if (resultIndex !== -1) {
                                position = results[resultIndex].position || resultIndex + 1;
                            }
                        }
                        
                        p.position = position;
                        console.log('🏁 Participant', p.name, 'position:', p.position, 'from results:', results);
                    });
                    
                    participants.sort((a, b) => {
                        const posA = a.position || 999;
                        const posB = b.position || 999;
                        return posA - posB;
                    });
                }
                
                const className = race.className || race.class || 'Unknown';
                const raceNumber = race.raceNumber || 'TBD';
                const bracketType = race.bracketType || 'upper';
                
                const statusDisplay = type === 'completed' ? 'Completed' : 
                                    race.status === 'in_progress' ? 'In Progress' : 
                                    'Upcoming';
                
                const statusClass = type === 'completed' ? 'completed' : 
                                  race.status === 'in_progress' ? 'in_progress' : 
                                  'upcoming';
                
                // Color coding based on class and bracket
                const classColors = {
                    '1': '#4a90e2', // Blue
                    '2': '#e74c3c', // Red
                    '3': '#f39c12', // Orange
                    '4': '#9b59b6', // Purple
                    '5': '#2ecc71', // Green
                    'Unknown': '#95a5a6' // Gray
                };
                
                const bracketColors = {
                    'upper': '#3498db',
                    'lower': '#e67e22',
                    'final': '#e74c3c'
                };
                
                const classColor = classColors[className] || classColors['Unknown'];
                const bracketColor = bracketColors[bracketType] || bracketColors['upper'];
                
                // Format race time (only for completed races)
                const formatRaceTime = (timestamp) => {
                    if (!timestamp) return '';
                    const date = new Date(timestamp);
                    const hours = date.getHours().toString().padStart(2, '0');
                    const minutes = date.getMinutes().toString().padStart(2, '0');
                    return `${hours}:${minutes}`;
                };
                
                // Only show time for completed races
                const raceTime = type === 'completed' ? formatRaceTime(race.completedAt || race.updatedAt || race.createdAt) : '';
                
                return `
                    <div class="race-card ${statusClass}" style="border-left: 3px solid ${classColor};">
                        <div class="race-header">
                            <div class="race-title">Race #${raceNumber}</div>
                            ${raceTime ? `<div class="race-time">${raceTime}</div>` : ''}
                        </div>
                        <div class="race-participants">
                            ${participants.length > 0 ? participants.map(participant => `
                                <div class="participant ${participant.position === 1 ? 'winner' : ''}">
                                    <div class="participant-info">
                                        <div class="participant-lane">L${participant.lane}</div>
                                        <div class="participant-name">${participant.name}
                                            ${participant.position === 1 ? '<span class="winner-badge" title="Winner">🏆</span>' : ''}
                                        </div>
                                    </div>
                                    ${type === 'completed' ? `<div class="participant-position">${this.formatOrdinal(participant.position)}</div>` : ''}
                                </div>
                            `).join('') : '<div class="participant"><span class="participant-name">No participants</span></div>'}
                        </div>
                    </div>
                `;
            }

            renderStatistics() {
                const container = document.getElementById('stats-container');
                const stats = this.calculateStats();
                const topDrivers = this.getTopDriversList();
                const plannedTotal = stats.plannedTotalRaces;
                const completed = stats.completedRaces;
                const remaining = Math.max(0, (plannedTotal || 0) - completed);
                const pct = stats.completionPercentage;

                const topDriversHtml = topDrivers.length > 0 ? topDrivers.map((d, i) => `
                    <div class="top-driver-item">
                        <div class="top-driver-name">${i + 1}. ${d.name}</div>
                        <div class="top-driver-wins">${d.wins}🏆</div>
                    </div>
                `).join('') : `<div class="top-driver-item"><div class="top-driver-name">No results yet</div></div>`;

                const html = `
                    <div class="stat-pages">
                        <div class="stat-page">
                            <div class="stat-progress">
                                <div class="progress-title">Event Progress</div>
                                <div class="progress-main">
                                    <div class="progress-percent">${pct}%</div>
                                    <div class="progress-subtext">${completed}/${plannedTotal || stats.expectedTotalRaces} races</div>
                                </div>
                                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                            </div>
                            <div class="stat-grid" style="margin-top:0.5rem">
                                <div class="stat-box">
                                    <div class="stat-title">Races Completed</div>
                                    <div class="stat-value">${completed}</div>
                                    <div class="stat-description">of ${plannedTotal || stats.expectedTotalRaces}</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-title">Races Remaining</div>
                                    <div class="stat-value">${remaining}</div>
                                    <div class="stat-description">planned</div>
                                </div>
                            </div>
                        </div>
                        <div class="stat-page">
                            <div class="stat-grid" style="grid-template-columns: 1fr 1fr;">
                                <div class="stat-box">
                                    <div class="stat-title">Participants</div>
                                    <div class="stat-value">${stats.totalParticipants}</div>
                                    <div class="stat-description">registered</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-title">Active Classes</div>
                                    <div class="stat-value">${stats.activeClasses}</div>
                                    <div class="stat-description">currently racing</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-title">Planned Races</div>
                                    <div class="stat-value">${plannedTotal || stats.expectedTotalRaces}</div>
                                    <div class="stat-description">set at start</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-title">Completed Classes</div>
                                    <div class="stat-value">${stats.completedClasses}</div>
                                    <div class="stat-description">finished</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="top-drivers" style="margin-top:0.5rem">
                        <h4 class="top-drivers-title">Top Drivers (wins)</h4>
                        ${topDriversHtml}
                    </div>
                `;

                // Only re-render stats if content changed to prevent flicker
                if (this._statsSig !== html) {
                    this._statsSig = html;
                    container.innerHTML = html;
                    // Ensure one visible page after render
                    const pages = container.querySelectorAll('.stat-page');
                    if (pages.length > 0) {
                        pages.forEach((p, idx) => p.classList.toggle('active', idx === this.currentStatsPage % pages.length));
                    }
                }
            }

            renderDriverProfile() {
                const container = document.getElementById('driver-profile');
                const list = this.getTopDriversList();
                const driver = list.length > 0 ? list[this.driverRotationIndex % list.length] : null;
                if (!driver) {
                    container.innerHTML = '';
                    return;
                }

                // Event-specific performance stats
                const ds = this.computeDriverEventStats(driver.id);

                // Minimize flicker: only update if content changes
                const newSig = `${driver.id}|${ds.totalRaces}|${ds.wins}|${ds.avgPos}|${ds.laneWinRate}`;
                if (this._driverSig === newSig) return;
                this._driverSig = newSig;

                const content = `
                    <div class=\"driver-avatar\">${driver.name.charAt(0)}</div>
                    <div class=\"driver-name\">${driver.name}</div>
                    <div class=\"driver-stats\">
                        <div class=\"driver-stat\">
                            <div class=\"driver-stat-value\">${ds.totalRaces}</div>
                            <div class=\"driver-stat-label\">Races</div>
                        </div>
                        <div class=\"driver-stat\">
                            <div class=\"driver-stat-value\">${ds.wins}</div>
                            <div class=\"driver-stat-label\">Wins</div>
                        </div>
                        <div class=\"driver-stat\">
                            <div class=\"driver-stat-value\">${ds.avgPos}</div>
                            <div class=\"driver-stat-label\">Avg Pos</div>
                        </div>
                        <div class=\"driver-stat\">
                            <div class=\"driver-stat-value\">${ds.laneWinRate}</div>
                            <div class=\"driver-stat-label\">Lane Win % (by lane)</div>
                        </div>
                    </div>`;

                container.innerHTML = `<div class=\"driver-profile-inner\">${content}</div>`;
                const inner = container.querySelector('.driver-profile-inner');
                requestAnimationFrame(() => inner.classList.add('slide-in'));
            }

            // Compute event-focused stats for a driver (current event only)
            computeDriverEventStats(participantId) {
                const res = { totalRaces: 0, wins: 0, avgPos: '—', laneWinRate: '—' };
                if (!this.currentEvent) return res;
                const bracket = this.raceBrackets?.[this.currentEvent.id];
                if (!bracket || !bracket.classes) return res;

                let sumPos = 0;
                let countPos = 0;
                const laneTotals = new Map();
                const laneWins = new Map();

                Object.values(bracket.classes).forEach(classBracket => {
                    (classBracket.rounds || []).forEach(round => {
                        (round.heats || []).forEach(heat => {
                            const results = Array.isArray(heat.results) ? heat.results : [];
                            const r = results.find(rr => rr.participantId === participantId);
                            if (!r) return;
                            res.totalRaces++;
                            const pos = typeof r.position === 'number' ? r.position : null;
                            if (pos === 1) res.wins++;
                            if (pos) {
                                sumPos += pos;
                                countPos++;
                            }
                            const lane = (heat.lanes || []).find(l => l.participant && l.participant.id === participantId)?.lane;
                            if (lane) {
                                laneTotals.set(lane, (laneTotals.get(lane) || 0) + 1);
                                if (pos === 1) laneWins.set(lane, (laneWins.get(lane) || 0) + 1);
                            }
                        });
                    });
                });

                if (countPos > 0) {
                    res.avgPos = Math.round((sumPos / countPos) * 10) / 10;
                }
                if (laneTotals.size > 0) {
                    // Build a compact per-lane display like L1 60% • L2 40%
                    const parts = [...laneTotals.entries()]
                        .sort((a,b) => a[0] - b[0])
                        .map(([lane, total]) => {
                            const wins = laneWins.get(lane) || 0;
                            const pct = Math.round((wins / total) * 100);
                            return `L${lane} ${pct}%`;
                        });
                    res.laneWinRate = parts.join(' • ');
                }
                return res;
            }

            // Compute expected total races for the whole event using class rosters and lanes per race
            calculateExpectedTotalRacesForEvent() {
                if (!this.currentEvent) return 0;
                const eventId = this.currentEvent.id;
                const lanesPerRace = parseInt(this.currentEvent.numberOfTracks || 4, 10);
                const eliminationType = (this.currentEvent.eliminationType || 'double').toLowerCase();

                // Build class -> Set(participantId) from participants belonging to this event
                const participantsArray = Array.isArray(this.participants) ? this.participants : [];
                const participantsForEvent = participantsArray.filter(p => p && (p.eventId === eventId));
                const classIdToParticipantIds = new Map();

                const addToClass = (classId, participantId) => {
                    if (!classId) return;
                    const key = String(classId).trim();
                    if (!key) return;
                    if (!classIdToParticipantIds.has(key)) {
                        classIdToParticipantIds.set(key, new Set());
                    }
                    classIdToParticipantIds.get(key).add(participantId);
                };

                for (const participant of participantsForEvent) {
                    // New schema: selectedClasses (array)
                    if (Array.isArray(participant.selectedClasses) && participant.selectedClasses.length > 0) {
                        participant.selectedClasses.forEach(c => addToClass(c, participant.id));
                    }
                    // Alternate schema: sledClasses (array)
                    else if (Array.isArray(participant.sledClasses) && participant.sledClasses.length > 0) {
                        participant.sledClasses.forEach(c => addToClass(c, participant.id));
                    }
                    // Legacy single-class schema
                    else if (participant.sledClass) {
                        addToClass(participant.sledClass, participant.id);
                    }
                }

                // If no explicit classes detected, treat the whole event as a single class
                if (classIdToParticipantIds.size === 0) {
                    const uniqueIds = new Set(participantsForEvent.map(p => p.id));
                    classIdToParticipantIds.set('ALL', uniqueIds);
                }

                let totalExpected = 0;
                for (const [, idSet] of classIdToParticipantIds.entries()) {
                    const n = idSet.size;
                    if (n <= 1) continue; // No races needed for 0/1 driver in a class
                    if (eliminationType === 'single') {
                        totalExpected += this.expectedRacesSingleElimination(n, lanesPerRace);
                    } else if (eliminationType === 'double' || eliminationType === 'double_random') {
                        totalExpected += this.expectedRacesDoubleElimination(n, lanesPerRace);
                    } else if (eliminationType === 'custom') {
                        const custom = Array.isArray(this.currentEvent.customOutcomes) ? this.currentEvent.customOutcomes : [];
                        const hasLose = custom.some(x => String(x).toLowerCase() === 'lose');
                        const lossLimit = Number.isFinite(this.currentEvent.customLossLimit) ? Number(this.currentEvent.customLossLimit) : 2;
                        
                        if (!hasLose || lossLimit === 1) {
                            totalExpected += this.expectedRacesSingleElimination(n, lanesPerRace);
                        } else if (lossLimit >= 2) {
                            totalExpected += this.expectedRacesDoubleElimination(n, lanesPerRace);
                        } else {
                            totalExpected += this.expectedRacesSingleElimination(n, lanesPerRace);
                        }
                    } else {
                        totalExpected += this.expectedRacesDoubleElimination(n, lanesPerRace);
                    }
                }

                return totalExpected;
            }

            // Single-elimination expected races with up to m lanes per heat
            expectedRacesSingleElimination(n, m) {
                if (!Number.isFinite(n) || !Number.isFinite(m) || n <= 1 || m <= 0) return 0;
                let remainingUndefeated = n;
                let total = 0;
                while (remainingUndefeated > 1) {
                    const winnerRaces = Math.ceil(remainingUndefeated / m);
                    total += winnerRaces;
                    remainingUndefeated = winnerRaces; // one winner per race advances
                }
                return total;
            }

            // Double-elimination expected races using the provided ceiling-based loop
            expectedRacesDoubleElimination(n, m) {
                if (!Number.isFinite(n) || !Number.isFinite(m) || n <= 1 || m <= 0) return 0;

                // Initialize
                let U = n; // undefeated pool entering the Winners bracket
                let L = 0; // Losers bracket pool
                let total = 0;

                // Round 1: Winners only
                const Rw1 = Math.ceil(U / m);
                total += Rw1;
                let nextU = Rw1;
                let nextL = U - Rw1; // all non-winners drop to losers
                U = nextU;
                L = nextL;

                // Subsequent rounds until each bracket has exactly one driver
                while (!(U === 1 && L === 1)) {
                    const Rw = Math.ceil(U / m);
                    total += Rw;
                    const dropToLosers = U - Rw;
                    const Rl = Math.ceil((L + dropToLosers) / m);
                    total += Rl;
                    U = Rw;
                    L = Rl;

                    // Safety to prevent pathological loops if inputs are odd
                    if (total > 100000) break;
                }

                // Final championship between bracket winners
                total += 1;
                return total;
            }

            calculateStats() {
                const eventParticipants = this.currentEvent?.participants || [];
                const totalParticipants = eventParticipants.length;

                // Prefer bracket-derived counts for accurate progress
                const eventId = this.currentEvent?.id;
                const bracket = this.raceBrackets?.[eventId];
                let completedRaces = 0;
                let totalHeats = 0;
                if (bracket && bracket.classes) {
                    Object.values(bracket.classes).forEach(cb => {
                        (cb.rounds || []).forEach(round => {
                            const heats = round.heats || [];
                            totalHeats += heats.length;
                            completedRaces += heats.filter(h => h.status === 'completed').length;
                        });
                    });
                } else {
                    const eventRaces = this.races.filter(r => !r.eventId || r.eventId === eventId);
                    completedRaces = eventRaces.filter(r => r.status === 'completed').length;
                }
                const plannedTotalRaces = Number.isFinite(this.currentEvent?.plannedTotalRaces) ? this.currentEvent.plannedTotalRaces : null;
                const expectedTotalRaces = plannedTotalRaces || (totalHeats > 0 ? totalHeats : this.calculateExpectedTotalRacesForEvent());

                // Check if event is completed by examining bracket classes directly
                let isEventComplete = false;
                if (bracket && bracket.classes) {
                    const classList = Object.values(bracket.classes);
                    const completedCount = classList.filter(c => c.isComplete).length;
                    isEventComplete = classList.length > 0 && completedCount === classList.length;
                }
                const forcedCompletedRaces = isEventComplete ? expectedTotalRaces : completedRaces;
                const completionPercentage = expectedTotalRaces > 0 ? Math.round((forcedCompletedRaces / expectedTotalRaces) * 100) : 0;

                // Count completed vs active classes from bracket if available
                let completedClasses = 0;
                let activeClasses = this.currentEvent?.classSettings?.length || 0;
                if (bracket && bracket.classes) {
                    const classList = Object.values(bracket.classes);
                    completedClasses = classList.filter(c => c.isComplete).length;
                    activeClasses = classList.length - completedClasses;
                }

                const remainingRaces = Math.max(0, expectedTotalRaces - forcedCompletedRaces);
                // Remaining participants still active (not eliminated or DSQ)
                let remainingParticipantsAlive = 0;
                if (bracket && bracket.classes) {
                    Object.values(bracket.classes).forEach(cb => {
                        remainingParticipantsAlive += (cb.participants || []).filter(p => p.status === 'active').length;
                    });
                } else {
                    remainingParticipantsAlive = totalParticipants; // fallback
                }

                return {
                    totalParticipants,
                    completedRaces: forcedCompletedRaces,
                    completionPercentage,
                    activeClasses,
                    remainingRaces,
                    completedClasses,
                    plannedTotalRaces,
                    expectedTotalRaces,
                    remainingParticipantsAlive
                };
            }

            getTopDriversList() {
                if (!this.currentEvent) return [];
                const eventId = this.currentEvent.id;
                const completedRaces = (this.races || []).filter(r => r.eventId === eventId && r.status === 'completed');
                if (completedRaces.length === 0) return [];

                const winCounts = new Map(); // participantId -> wins

                const extractWinnerIds = (race) => {
                    const results = race.results || race.raceResults || race.finishOrder || [];
                    const winners = [];

                    // Case 1: results is an array of objects {participantId, position}
                    if (Array.isArray(results)) {
                        results.forEach(res => {
                            const pos = res.position || res.resultPosition || null;
                            const pid = res.participantId || res.participant || null;
                            if (pid && pos === 1) winners.push(pid);
                        });
                    } else if (results && typeof results === 'object') {
                        // Case 2: object map {participantId: position}
                        Object.entries(results).forEach(([key, value]) => {
                            if (value === 1) winners.push(key);
                        });
                        // Case 3: finishOrder array inside object
                        if (Array.isArray(results.finishOrder) && results.finishOrder.length > 0) {
                            winners.push(results.finishOrder[0]);
                        }
                    }
                    return winners;
                };

                completedRaces.forEach(race => {
                    const winners = extractWinnerIds(race);
                    winners.forEach(pid => {
                        winCounts.set(pid, (winCounts.get(pid) || 0) + 1);
                    });
                });

                const participantsById = new Map((Array.isArray(this.participants) ? this.participants : []).map(p => [p.id, p]));
                const ranked = Array.from(winCounts.entries())
                    .map(([pid, wins]) => ({ id: pid, wins, name: participantsById.get(pid)?.name || `Driver ${String(pid).slice(-4)}` }))
                    .sort((a, b) => b.wins - a.wins)
                    .slice(0, 6);
                return ranked;
            }

            // Deprecated; replaced by getTopDriversList and rotation

            extractRacesFromBrackets(brackets, eventIdOverride = null) {
                const races = [];
                
                if (!brackets) {
                    return races;
                }
                
                if (brackets.classes) {
                    Object.entries(brackets.classes).forEach(([className, classData]) => {
                        if (classData.rounds && Array.isArray(classData.rounds)) {
                            classData.rounds.forEach((round, roundIndex) => {
                                // Debug log for bracketType
                                console.log('🔎 Round extraction:', { roundIndex, round, bracketType: round.bracketType });
                                let bracketType = round.bracketType;
                                // Try to infer bracketType if missing
                                if (!bracketType) {
                                    if (round.name && typeof round.name === 'string') {
                                        if (round.name.toLowerCase().includes('lower')) bracketType = 'lower';
                                        else if (round.name.toLowerCase().includes('final')) bracketType = 'final';
                                        else if (round.name.toLowerCase().includes('upper')) bracketType = 'upper';
                                    }
                                    if (!bracketType && round.type && typeof round.type === 'string') {
                                        bracketType = round.type.toLowerCase();
                                    }
                                }
                                if (!bracketType && round.heats && round.heats.length > 0) {
                                    // Try to infer from heat data
                                    const heatBracket = round.heats[0].bracketType || round.heats[0].bracket;
                                    if (heatBracket) bracketType = heatBracket;
                                }
                                if (!bracketType) bracketType = 'unknown';
                                if (round.heats && Array.isArray(round.heats)) {
                                    round.heats.forEach((heat, heatIndex) => {
                                        console.log('🏁 Extracting heat:', heat);
                                        console.log('🏁 Heat bracketType:', heat.bracketType);
                                        console.log('🏁 Round bracketType:', round.bracketType);
                                        console.log('🏁 Heat results:', heat.results);
                                        
                                        // Use heat's bracketType first, then round's bracketType, then inferred
                                        let finalBracketType = heat.bracketType || round.bracketType || bracketType;
                                        
                                        const race = {
                                            id: heat.id || `heat_${className}_${roundIndex}_${heatIndex}`,
                                            className: className,
                                            round: roundIndex + 1,
                                            heatNumber: heat.heatNumber || (heatIndex + 1),
                                            raceNumber: heat.raceNumber || null,
                                            numberOfLanes: heat.numberOfLanes || classData.numberOfLanes || 4,
                                            status: heat.status === 'completed' ? 'completed' : 
                                                   heat.status === 'in_progress' ? 'in_progress' : 'scheduled',
                                            participants: heat.participants || [],
                                            lanes: heat.lanes || [],
                                            results: heat.results || heat.finishOrder || {},
                                            scheduledTime: heat.scheduledTime || heat.startTime,
                                            completedAt: heat.completedAt || heat.endTime,
                                            createdAt: heat.createdAt || new Date().toISOString(),
                                            eliminationType: classData.eliminationType || 'single',
                                            bracketType: finalBracketType,
                                             isComplete: heat.status === 'completed' || false,
                                             eventId: eventIdOverride || brackets.eventId || null
                                        };
                                        races.push(race);
                                    });
                                }
                            });
                        }
                    });
                }
                
                return races;
            }

            // Choose current event based on latest race activity
            findEventFromRaceActivity() {
                if (!this.events || this.events.length === 0) return null;
                if (!this.races || this.races.length === 0) return null;

                // Prioritize races in progress, then most recently completed, then most recently scheduled
                const byPriorityTime = (race) => new Date(
                    race.completedAt || race.updatedAt || race.scheduledTime || race.createdAt || 0
                ).getTime();

                // Filter races that have an eventId so we can map back to event
                const racesWithEvent = this.races.filter(r => r.eventId);
                if (racesWithEvent.length === 0) return null;

                // Find latest in-progress
                const inProgress = [...racesWithEvent]
                    .filter(r => r.status === 'in_progress')
                    .sort((a, b) => byPriorityTime(b) - byPriorityTime(a));
                if (inProgress.length > 0) {
