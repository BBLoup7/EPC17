                    return this.events.find(e => e.id === inProgress[0].eventId) || null;
                }

                // Otherwise latest completed
                const completed = [...racesWithEvent]
                    .filter(r => r.status === 'completed')
                    .sort((a, b) => byPriorityTime(b) - byPriorityTime(a));
                if (completed.length > 0) {
                    return this.events.find(e => e.id === completed[0].eventId) || null;
                }

                // Otherwise latest scheduled
                const scheduled = [...racesWithEvent]
                    .filter(r => r.status === 'scheduled' || r.status === 'pending')
                    .sort((a, b) => byPriorityTime(b) - byPriorityTime(a));
                if (scheduled.length > 0) {
                    return this.events.find(e => e.id === scheduled[0].eventId) || null;
                }

                return null;
            }

            findEventWithRaceResults() {
                // Get all races with results
                const racesWithResults = this.races.filter(race => 
                    race.status === 'completed' && race.results && Object.keys(race.results).length > 0
                );
                
                if (racesWithResults.length === 0) {
                    console.log('🏁 No races with results found');
                    return null;
                }
                
                console.log('🏁 Found races with results:', racesWithResults.length);
                
                // Group races by event ID
                const eventRaceCounts = {};
                racesWithResults.forEach(race => {
                    // Try to find eventId from race data
                    let eventId = race.eventId;
                    
                    // If no eventId, try to match by event name or other properties
                    if (!eventId && this.events.length > 0) {
                        // For now, if no eventId, assume it belongs to the most recent event
                        eventId = this.events[0].id;
                    }
                    
                    if (eventId) {
                        eventRaceCounts[eventId] = (eventRaceCounts[eventId] || 0) + 1;
                    }
                });
                
                console.log('🏁 Events with race results:', eventRaceCounts);
                
                // Find the event with the most completed races
                let bestEvent = null;
                let maxRaces = 0;
                
                this.events.forEach(event => {
                    const raceCount = eventRaceCounts[event.id] || 0;
                    console.log(`🏁 Event ${event.name}: ${raceCount} completed races`);
                    if (raceCount > maxRaces) {
                        maxRaces = raceCount;
                        bestEvent = event;
                    }
                });
                
                if (bestEvent) {
                    console.log(`🏁 Selected event with most results: ${bestEvent.name} (${maxRaces} completed races)`);
                } else {
                    console.log('🏁 No event found with race results, will use most recent event');
                }
                
                return bestEvent;
            }

            // Helper to get group key and label
            getRaceGroupKey(race) {
                const className = race.className || race.class || 'Unknown';
                const bracket = race.bracketType || race.bracket || '';
                const round = race.round || race.roundNumber || '';
                
                // Check if this is a final
                if (bracket.toLowerCase().includes('final') || bracket.toLowerCase() === 'final') {
                    return `final-${className}`;
                }
                
                // Each bracket should be its own group
                return `${className}-${bracket}-${round}`;
            }
            
            getRaceGroupLabel(race) {
                const className = race.className || race.class || 'Unknown';
                let bracket = (race.bracketType || race.bracket || '').toLowerCase();
                const round = race.round || race.roundNumber || '';
                
                // Only show bracket if it's upper, lower, or final
                let bracketLabel = '';
                if (bracket === 'upper') bracketLabel = 'Upper';
                else if (bracket === 'lower') bracketLabel = 'Lower';
                else if (bracket === 'final') bracketLabel = 'Final';
                
                // Check if this is a final
                if (bracket === 'final') {
                    return `Final Round${className !== 'Unknown' ? ' – Class ' + className : ''}`;
                }
                
                let label = '';
                if (className !== 'Unknown') label += `Class ${className}`;
                if (bracketLabel && bracketLabel !== 'Final') label += (label ? ' – ' : '') + bracketLabel;
                if (round) label += (label ? ' – ' : '') + `Round ${round}`;
                return label || 'Other';
            }
            capitalize(str) {
                if (!str) return '';
                return str.charAt(0).toUpperCase() + str.slice(1);
            }
            
            getBracketType(race) {
                const bracket = (race.bracketType || race.bracket || '').toLowerCase();
                if (bracket === 'upper') return 'upper';
                if (bracket === 'lower') return 'lower';
                if (bracket === 'final' || bracket.includes('final')) return 'final';
                return 'unknown';
            }

            // Stable race ordering key for upcoming list
            getRaceSequence(race) {
                const n = (val) => {
                    const parsed = parseInt(val, 10);
                    return Number.isFinite(parsed) ? parsed : null;
                };
                const raceNumber = n(race.raceNumber);
                if (raceNumber !== null) return raceNumber;
                const round = n(race.round || race.roundNumber) || 0;
                const heat = n(race.heatNumber) || 0;
                // Compose a stable sequence: round first, then heat
                return round * 1000 + heat;
            }

            // Render grouped races (for both recent and upcoming)
            renderGroupedRacesSorted(races, type) {
                if (!races || races.length === 0) return '';
                let html = '';
                let lastGroupKey = null;
                let lastClassName = null;
                races.forEach((race, idx) => {
                    const groupKey = this.getRaceGroupKey(race);
                    if (groupKey !== lastGroupKey) {
                        // New group header
                        if (idx !== 0) {
                            html += '<div class="group-separator"></div>';
                        }
                        const bracketType = this.getBracketType(race);
                        const className = race.className || race.class || 'Unknown';
                        
                        // Check if this is a different class from the previous one
                        const sameClassAsPrevious = className === lastClassName;
                        const classSeparatorClass = sameClassAsPrevious ? 'same-class-as-previous' : '';
                        
                        html += `<div class="group-header ${classSeparatorClass}" data-bracket="${bracketType}" data-class="${className}">${this.getRaceGroupLabel(race)}</div>`;
                        lastGroupKey = groupKey;
                        lastClassName = className;
                    }
                    html += this.createRaceCard(race, type);
                });
                return html;
            }

            // Update renderRecentResults
            renderRecentResults() {
                const container = document.getElementById('recent-results-grid');
                // Filter races for current event and completed status
                const recentRaces = (this.races || [])
                    .filter(race => {
                        const eventMatch = !race.eventId || race.eventId === this.currentEvent?.id;
                        return eventMatch && race.status === 'completed';
                    })
                    .sort((a, b) => {
                        // Sort by completion time (latest first)
                        const timeA = a.completedAt || a.updatedAt || a.createdAt || 0;
                        const timeB = b.completedAt || b.updatedAt || b.createdAt || 0;
                        return new Date(timeB) - new Date(timeA);
                    });
                if (recentRaces.length === 0) {
                    container.innerHTML = `
                        <div class="no-data-message">
                            <i class="fas fa-trophy"></i>
                            <h3>No Recent Results</h3>
                            <p>No races completed yet</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = this.renderGroupedRacesSorted(recentRaces, 'completed');
                }
            }



            // Update renderUpcomingRaces
            renderUpcomingRaces() {
                const container = document.getElementById('upcoming-races-grid');
                // Filter races for current event and upcoming status
                const upcomingRaces = (this.races || [])
                    .filter(race => {
                        const eventMatch = !race.eventId || race.eventId === this.currentEvent?.id;
                        const statusMatch = race.status === 'scheduled' || race.status === 'in_progress' || race.status === 'pending';
                        return eventMatch && statusMatch;
                    })
                    .sort((a, b) => {
                        // In-progress first
                        const statusRank = (r) => r.status === 'in_progress' ? 0 : 1;
                        const sr = statusRank(a) - statusRank(b);
                        if (sr !== 0) return sr;
                        // Then by numeric sequence ascending (raceNumber or round/heat)
                        const seqA = this.getRaceSequence(a);
                        const seqB = this.getRaceSequence(b);
                        if (seqA !== seqB) return seqA - seqB;
                        // Fallback by created time ascending to maintain stability
                        const timeA = new Date(a.createdAt || a.scheduledTime || 0).getTime();
                        const timeB = new Date(b.createdAt || b.scheduledTime || 0).getTime();
                        return timeA - timeB;
                    });
                if (upcomingRaces.length === 0) {
                    container.innerHTML = `
                        <div class="no-data-message">
                            <i class="fas fa-flag-checkered"></i>
                            <h3>No Upcoming Races</h3>
                            <p>All races completed or none scheduled</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = this.renderGroupedRacesSorted(upcomingRaces, 'upcoming');
                }
            }

            formatOrdinal(num) {
                if (!num || num === 0) return '';
                
                // Don't add ordinal suffix for DSQ or FS
                if (typeof num === 'string' && (num.toUpperCase() === 'DSQ' || num.toUpperCase() === 'FS')) {
                    return num;
                }
                
                const j = num % 10;
                const k = num % 100;
                if (j === 1 && k !== 11) {
                    return num + "st";
                }
                if (j === 2 && k !== 12) {
                    return num + "nd";
                }
                if (j === 3 && k !== 13) {
                    return num + "rd";
                }
                return num + "th";
            }

            formatTime(timestamp) {
                if (!timestamp) return 'TBD';
                const date = new Date(timestamp);
                return date.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: false 
                });
            }
        }

            }
        }

        // Wait for authentication to complete before loading data
        async function waitForAuthentication() {
            console.log('🔐 Live Display: Waiting for authentication to complete...');
            
            // Wait for Auth to be available and initialized
            let attempts = 0;
            while (!window.Auth && attempts < 100) { // Max 5 seconds
                await new Promise(resolve => setTimeout(resolve, 50));
                attempts++;
            }
            
            if (!window.Auth) {
                console.warn('🔐 Live Display: Auth system not available after waiting, proceeding without authentication');
                return false;
            }
            
            // Wait a bit more for session restoration to complete
            await new Promise(resolve => setTimeout(resolve, 300));
            
            // Check if we have a valid session
            if (!window.currentUser) {
                console.log('🔐 Live Display: No current user, authentication failed');
                return false;
            }
            
            console.log('🔐 Live Display: Authentication complete, proceeding with data load');
            return true;
        }

        // Start waiting for app initialization
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📄 DOM loaded, waiting for app initialization...');
            waitForAppInitialization();
        });
    </script>
</body>
