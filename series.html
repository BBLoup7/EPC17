<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Series - EPC TECHNOLOGY</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="styles/pages/series.css">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="page-series cv-shell">
	<main class="main-content">
		<header class="series-page-header page-header cv-page-header hud-panel">
			<div>
				<h1 class="cv-hero-title" style="font-size:1.5rem;">Series <span class="cv-accent">Management</span></h1>
				<p class="subtitle cv-hero-subtitle">Championships · seasons · classes</p>
			</div>
			<button type="button" class="btn btn-primary" id="createSeriesBtn">
				<i class="fas fa-plus" aria-hidden="true"></i> Create Series
			</button>
		</header>

		<div class="series-stats-row" aria-label="Series overview">
			<div class="cv-stat-card accent-blue hud-panel">
				<span class="cv-stat-label telemetry-label">Total Series</span>
				<div class="cv-stat-value" id="totalSeries">0</div>
			</div>
			<div class="cv-stat-card accent-orange hud-panel">
				<span class="cv-stat-label telemetry-label">Active</span>
				<div class="cv-stat-value" id="activeSeries">0</div>
			</div>
			<div class="cv-stat-card accent-magenta hud-panel">
				<span class="cv-stat-label telemetry-label">Linked Events</span>
				<div class="cv-stat-value" id="totalEvents">0</div>
			</div>
		</div>

		<div class="series-toolbar">
			<input type="search" id="seriesSearch" class="form-control" placeholder="Search series…" aria-label="Search series" />
			<select id="seriesStatusFilter" class="form-control" aria-label="Filter by status" style="max-width:160px;">
				<option value="all">All statuses</option>
				<option value="active" selected>Active</option>
				<option value="archived">Archived</option>
			</select>
			<select id="seriesSort" class="form-control" aria-label="Sort series" style="max-width:200px;">
				<option value="name-asc">Name (A–Z)</option>
				<option value="name-desc">Name (Z–A)</option>
				<option value="events-desc">Events (High–Low)</option>
				<option value="events-asc">Events (Low–High)</option>
				<option value="updated-desc">Recently updated</option>
			</select>
			<div class="series-toolbar-spacer"></div>
		</div>

		<div class="series-workspace">
			<div class="card hud-panel series-list-panel">
				<div id="seriesList" class="series-list" role="listbox" aria-label="Series"></div>
			</div>
			<div class="card hud-panel series-detail-panel" id="seriesDetail" aria-live="polite">
				<div class="series-empty-detail">
					<p>Loading series…</p>
				</div>
			</div>
		</div>
	</main>

	<script src="utils/constants.js"></script>
	<script src="utils/helpers.js"></script>
	<script src="utils/auth.js"></script>
	<script src="utils/data-manager.js"></script>
	<script src="modules/series-data.js"></script>
	<script src="modules/series-logic.js"></script>
	<script src="modules/series-ui.js"></script>
	<script src="modules/series-form.js"></script>
	<script src="modules/series.js"></script>
	<script src="js/sidebar-nav.js"></script>
	<script>
		(async function initSeriesPage() {
			try {
				if (window.Auth?.init) {
					await window.Auth.init();
				}
				if (!window.dataManager) {
					window.dataManager = new DataManager();
				}
				await window.dataManager.loadFromStorage(['series', 'events']);

				window.seriesManager = new SeriesManager();

				// Wait until SeriesManager finishes its auth/init handshake
				for (let i = 0; i < 40 && !window.seriesManager.initialized; i++) {
					await new Promise((r) => setTimeout(r, 50));
				}
				await window.seriesManager.loadSeriesContent();
			} catch (error) {
				console.error('Series page init failed:', error);
				const detail = document.getElementById('seriesDetail');
				if (detail) {
					detail.innerHTML = `<div class="series-empty-detail"><p>Failed to load series. ${error.message || ''}</p></div>`;
				}
			}
		})();
	</script>
</body>
</html>
