<template id="series-details">
    <div class="series-details">
        <!-- Hero Header -->
        <div class="series-hero">
            <div class="hero-content">
                <div class="hero-info">
                    <h1 id="seriesName" class="series-title">Series Name</h1>
                    <div class="series-meta">
                        <span class="status-badge" id="seriesStatus">Status</span>
                        <span class="date-range" id="dateRange">Date Range</span>
                    </div>
                    <p id="seriesDescription" class="series-description">No description available.</p>
                </div>
                <div class="hero-actions">
                    <button class="btn btn-secondary" id="editBtn">
                        <i class="fas fa-edit"></i> Edit Series
                    </button>
                    <button class="btn btn-primary" id="addEventBtn">
                        <i class="fas fa-plus"></i> Add Event
                    </button>
                </div>
            </div>
        </div>

        <!-- Content Sections -->
        <div class="content-sections">
            <!-- Rules Section -->
            <div class="content-section">
                <div class="section-header">
                    <h3>
                        <i class="fas fa-book"></i>
                        Rules & Regulations
                    </h3>
                </div>
                <div class="section-content">
                    <div id="seriesRules" class="rules-content">
                        <div class="empty-content">
                            <i class="fas fa-gavel"></i>
                            <p>No rules specified for this series.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Points System Section -->
            <div class="content-section">
                <div class="section-header">
                    <h3>
                        <i class="fas fa-chart-line"></i>
                        Points System
                    </h3>
                </div>
                <div class="section-content">
                    <div class="points-table" id="pointsTable">
                        <div class="empty-content">
                            <i class="fas fa-chart-bar"></i>
                            <p>Points system not configured yet.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Events Section -->
            <div class="content-section">
                <div class="section-header">
                    <h3>
                        <i class="fas fa-calendar-alt"></i>
                        Events
                    </h3>
                    <div class="section-actions">
                        <div class="event-filters">
                            <select id="eventStatus" class="filter-select">
                                <option value="all">All Events</option>
                                <option value="upcoming">Upcoming</option>
                                <option value="active">Active</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="section-content">
                    <div class="events-list" id="eventsList">
                        <div class="empty-content">
                            <i class="fas fa-calendar"></i>
                            <p>No events scheduled for this series.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Standings Section -->
            <div class="content-section">
                <div class="section-header">
                    <h3>
                        <i class="fas fa-trophy"></i>
                        Standings
                    </h3>
                    <div class="section-actions">
                        <button class="btn btn-secondary" id="exportStandingsBtn">
                            <i class="fas fa-download"></i> Export
                        </button>
                    </div>
                </div>
                <div class="section-content">
                    <div class="standings-table" id="standingsTable">
                        <div class="empty-content">
                            <i class="fas fa-medal"></i>
                            <p>Standings will appear here once events are completed.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .series-details {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
        }

        /* Hero Section */
        .series-hero {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-radius: 12px;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }


        .hero-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            z-index: 1;
            gap: 2rem;
        }

        .hero-info {
            flex: 1;
        }

        .series-title {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-orange-warm) 0%, var(--accent-orange-glow) 50%, var(--accent-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 0.75rem 0;
            line-height: 1.2;
        }

        .series-meta {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .status-badge.active {
            background: var(--accent-orange-warm);
            box-shadow: 0 4px 12px rgba(255, 140, 66, 0.3);
        }

        .status-badge.upcoming {
            background: var(--accent-warning);
            color: #000;
            box-shadow: 0 4px 12px rgba(214, 158, 46, 0.3);
        }

        .status-badge.completed {
            background: var(--accent-info);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .date-range {
            padding: 0.5rem 1rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .series-description {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0;
            max-width: 600px;
        }

        .hero-actions {
            display: flex;
            gap: 1rem;
            flex-shrink: 0;
        }

        .hero-actions .btn {
            padding: 1rem 1.5rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .hero-actions .btn:hover {
            transform: translateY(-2px);
        }

        .hero-actions .btn-primary {
            background: linear-gradient(135deg, var(--accent-orange-warm), var(--accent-primary));
            box-shadow: 0 4px 15px rgba(255, 140, 66, 0.3);
        }

        .hero-actions .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(255, 140, 66, 0.4);
        }

        .hero-actions .btn-secondary:hover {
            border-color: var(--accent-orange-warm);
            color: var(--accent-orange-warm);
            background: rgba(255, 140, 66, 0.1);
        }

        /* Content Sections */
        .content-sections {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .content-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .section-header h3 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .section-header i {
            color: var(--accent-primary);
            font-size: 1.1rem;
        }

        .section-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .section-content {
            padding: 1.5rem;
        }

        .empty-content {
            text-align: center;
            padding: 2rem 1.5rem;
            color: var(--text-secondary);
        }

        .empty-content i {
            font-size: 2rem;
            color: var(--accent-secondary);
            margin-bottom: 0.75rem;
            opacity: 0.5;
        }

        .empty-content p {
            font-size: 1rem;
            margin: 0;
            line-height: 1.4;
        }

        /* Rules Content */
        .rules-content {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            min-height: 80px;
        }

        /* Points Table */
        .points-table {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            min-height: 80px;
        }

        /* Events List */
        .events-list {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            min-height: 80px;
        }

        /* Standings Table */
        .standings-table {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            min-height: 80px;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .series-title {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .series-hero {
                padding: 2rem 1rem;
                margin-bottom: 1.5rem;
            }

            .hero-content {
                flex-direction: column;
                gap: 1.5rem;
            }

            .series-title {
                font-size: 2rem;
            }

            .series-description {
                font-size: 1rem;
            }

            .hero-actions {
                width: 100%;
                justify-content: stretch;
            }

            .hero-actions .btn {
                flex: 1;
                justify-content: center;
            }

            .section-header {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }

            .section-actions {
                justify-content: center;
            }

            .section-content {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .series-hero {
                padding: 1.5rem 1rem;
            }

            .series-title {
                font-size: 1.75rem;
            }

            .series-meta {
                flex-direction: column;
                align-items: stretch;
            }

            .status-badge,
            .date-range {
                text-align: center;
            }

            .section-content {
                padding: 1rem;
            }

            .empty-content {
                padding: 2rem 1rem;
            }

            .empty-content i {
                font-size: 2rem;
            }
        }
    </style>

    <script>
        class SeriesDetails extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.shadowRoot.innerHTML = document.querySelector('#series-details').innerHTML;
                this.seriesManager = null;
                this.seriesId = null;
            }

            connectedCallback() {
                this.seriesManager = new SeriesManager();
                this.setupEventListeners();
            }

            setupEventListeners() {
                const editBtn = this.shadowRoot.querySelector('#editBtn');
                const addEventBtn = this.shadowRoot.querySelector('#addEventBtn');
                const eventStatus = this.shadowRoot.querySelector('#eventStatus');
                const exportBtn = this.shadowRoot.querySelector('#exportStandingsBtn');

                editBtn.addEventListener('click', () => this.editSeries());
                addEventBtn.addEventListener('click', () => this.addEvent());
                eventStatus.addEventListener('change', () => this.filterEvents());
                exportBtn.addEventListener('click', () => this.exportStandings());
            }

            async loadSeries(seriesId) {
                this.seriesId = seriesId;
                const series = this.seriesManager.getSeries(seriesId);
                
                if (series) {
                    this.seriesManager.initSeries(seriesId, series);
                    this.updateSeriesInfo(series);
                    this.updatePointsTable(series.pointsSystem);
                    this.loadEvents();
                    this.loadStandings();
                }
            }

            updateSeriesInfo(series) {
                this.shadowRoot.querySelector('#seriesName').textContent = series.name;
                this.shadowRoot.querySelector('#seriesStatus').textContent = series.status;
                this.shadowRoot.querySelector('#seriesStatus').className = `status-badge ${series.status}`;
                this.shadowRoot.querySelector('#dateRange').textContent = 
                    `${new Date(series.startDate).toLocaleDateString()} - ${new Date(series.endDate).toLocaleDateString()}`;
                
                const description = this.shadowRoot.querySelector('#seriesDescription');
                description.textContent = series.description || 'No description available.';

                const rules = this.shadowRoot.querySelector('#seriesRules');
                rules.textContent = series.rules || 'No rules specified.';
            }

            updatePointsTable(pointsSystem) {
                const table = this.shadowRoot.querySelector('#pointsTable');
                table.innerHTML = '';

                Object.entries(pointsSystem).forEach(([position, points]) => {
                    const item = document.createElement('div');
                    item.className = 'point-item';
                    item.innerHTML = `
                        <div class="point-position">${position}</div>
                        <div class="point-value">${points} points</div>
                    `;
                    table.appendChild(item);
                });
            }

            async loadEvents() {
                const events = Array.from(this.seriesManager.currentSeries.events.values());
                this.renderEvents(events);
            }

            renderEvents(events) {
                const list = this.shadowRoot.querySelector('#eventsList');
                list.innerHTML = '';

                events.forEach(event => {
                    const card = document.createElement('div');
                    card.className = 'event-card';
                    card.innerHTML = `
                        <div class="event-info">
                            <h4>${event.name}</h4>
                            <div class="event-meta">
                                <span>${new Date(event.date).toLocaleDateString()}</span>
                                <span class="status-badge ${event.status}">${event.status}</span>
                            </div>
                        </div>
                        <div class="event-actions">
                            <button class="btn btn-secondary" data-id="${event.id}">
                                <i class="fas fa-eye"></i> View
                            </button>
                            <button class="btn btn-primary" data-id="${event.id}">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                        </div>
                    `;

                    // Add event listeners
                    card.querySelector('.btn-secondary').addEventListener('click', (e) => {
                        this.viewEvent(e.target.dataset.id);
                    });

                    card.querySelector('.btn-primary').addEventListener('click', (e) => {
                        this.editEvent(e.target.dataset.id);
                    });

                    list.appendChild(card);
                });
            }

            filterEvents() {
                const status = this.shadowRoot.querySelector('#eventStatus').value;
                const events = Array.from(this.seriesManager.currentSeries.events.values())
                    .filter(event => status === 'all' || event.status === status);
                this.renderEvents(events);
            }

            async loadStandings() {
                const standings = this.seriesManager.getStandings();
                this.renderStandings(standings);
            }

            renderStandings(standings) {
                const table = this.shadowRoot.querySelector('#standingsTable');
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Participant</th>
                            <th>Points</th>
                            <th>Events</th>
                            <th>Wins</th>
                            <th>Podiums</th>
                            <th>Top 10</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${standings.map(standing => `
                            <tr>
                                <td class="position-cell">${standing.position}</td>
                                <td>${standing.participant.name}</td>
                                <td class="points-cell">${standing.points}</td>
                                <td>${standing.events}</td>
                                <td>${standing.wins}</td>
                                <td>${standing.podiums}</td>
                                <td>${standing.top10}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                `;
            }

            editSeries() {
                this.dispatchEvent(new CustomEvent('edit', {
                    detail: { seriesId: this.seriesId }
                }));
            }

            addEvent() {
                this.dispatchEvent(new CustomEvent('addEvent', {
                    detail: { seriesId: this.seriesId }
                }));
            }

            viewEvent(eventId) {
                this.dispatchEvent(new CustomEvent('viewEvent', {
                    detail: { eventId }
                }));
            }

            editEvent(eventId) {
                this.dispatchEvent(new CustomEvent('editEvent', {
                    detail: { eventId }
                }));
            }

            exportStandings() {
                const standings = this.seriesManager.getStandings();
                const csv = this.convertToCSV(standings);
                this.downloadCSV(csv, `${this.seriesManager.currentSeries.name}_standings.csv`);
            }

            convertToCSV(standings) {
                const headers = ['Position', 'Participant', 'Points', 'Events', 'Wins', 'Podiums', 'Top 10'];
                const rows = standings.map(s => [
                    s.position,
                    s.participant.name,
                    s.points,
                    s.events,
                    s.wins,
                    s.podiums,
                    s.top10
                ]);
                return [headers, ...rows].map(row => row.join(',')).join('\n');
            }

            downloadCSV(csv, filename) {
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                window.URL.revokeObjectURL(url);
            }
        }

        customElements.define('series-details', SeriesDetails);
    </script>
</template>
