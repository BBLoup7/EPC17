    <div class="list-header">
        <h3>Registered Participants</h3>
        <div class="component-status" id="componentStatus" style="color: orange; font-size: 0.9rem; margin-bottom: 0.5rem;">
            🔄 Loading participant list component...
        </div>
        <div class="list-filters">
            <input type="text" class="form-control" placeholder="Search participants by name, number, sled..." id="participantSearch">
            
            <!-- Event Combo Box -->
            <div class="combo-box-container">
                <input type="text" class="form-control combo-input" id="eventFilterInput" placeholder="Search events..." autocomplete="off">
                <div class="combo-dropdown" id="eventFilterDropdown" style="display: none;">
                    <div class="combo-option" data-value="">All Events</div>
                </div>

            </div>
            
            <!-- Class Combo Box -->
            <div class="combo-box-container">
                <input type="text" class="form-control combo-input" id="classFilterInput" placeholder="Search classes..." autocomplete="off">

        <!-- Skeleton cards will be populated by JavaScript -->
    </div>
        
        <!-- Pagination -->
        <div id="participantsPagination"></div>
    </div>
</div>

<script>
// Prevent multiple script executions
if (!window.participantListScriptLoaded) {
    window.participantListScriptLoaded = true;

// Global variables with performance optimizations
let allParticipants = [];
let allEvents = [];
let filteredParticipants = [];
let currentPage = 1;
const itemsPerPage = 50; // Increased for better performance

// Performance optimization: Cache frequently accessed data
const performanceCache = {
    participantEventMap: new Map(),
    lastCacheUpdate: 0,
    cacheTTL: 60000, // 1 minute cache
    virtualRows: new Map(),
    renderedRange: { start: 0, end: itemsPerPage }
};

// Virtual scrolling implementation
const virtualScrollConfig = {
    rowHeight: 60, // Estimated row height in pixels
    containerHeight: 400, // Visible container height
    overscan: 5 // Extra rows to render outside visible area
};

// Refresh participant data without reinitializing the component
async function refreshParticipantList() {
    console.log('🔄 Refreshing participant list data...');
    
    if (!window.dataManager) {
        console.error('❌ DataManager not available for refresh');
        return;
    }
    
    try {
        // Force reload data from server (bypass cache)
        console.log('🔄 Reloading data from server (forced)...');
        await window.dataManager.loadFromStorage(['participants', 'events'], true);
        
        // Reload the participant data
        await loadParticipantData();
        
        // Refresh dropdown options
        loadEventOptions();
        loadClassOptions();
        
        console.log('✅ Participant list refreshed successfully');
        
    } catch (error) {
        console.error('❌ Error refreshing participant list:', error);
    }
}

// Initialize the participant list
async function initializeParticipantList() {
    // Prevent multiple initializations
    if (window.participantListInitialized) {
        console.log('🚫 Participant list already initialized, skipping');
        return;
    }
    
    console.log('🔄 Initializing participant list component...');
    console.log('📊 DataManager available:', !!window.dataManager);
    console.log('📊 DataManager methods:', window.dataManager ? Object.keys(window.dataManager) : 'N/A');
    
    // Check if DataManager is properly loaded
    if (!window.dataManager || typeof window.dataManager.getParticipants !== 'function') {
        console.warn('⚠️ DataManager not ready, retrying in 500ms...');
        setTimeout(initializeParticipantList, 500);
        return;
    }
    
    // Ensure data is loaded before proceeding
    try {
        console.log('🔄 Ensuring data is loaded from server...');
        await window.dataManager.loadFromStorage(['participants', 'events']);
        console.log('✅ Data loaded successfully');
    } catch (error) {
        console.error('❌ Failed to load data:', error);
        // Continue anyway with empty data
    }
    
    // Verify we actually have data before proceeding
    const testParticipants = window.dataManager.getParticipantsArray();
    const testEvents = window.dataManager.getEventsArray();
    console.log('🔍 Pre-init data check - Participants:', testParticipants?.length, 'Events:', testEvents?.length);
    
    // Initialize even with empty data - don't retry
    if ((!testParticipants || testParticipants.length === 0) && (!testEvents || testEvents.length === 0)) {
        console.log('ℹ️ DataManager has no data yet, but initializing component anyway');
    }
    
    window.participantListInitialized = true;
    
    // Load data first
    loadParticipantData();
    
    // Set up filters after data is loaded
    setupParticipantFilters();
    
    // Load dropdown options after data is available
    loadEventOptions();
    loadClassOptions();
    
    // Set up combo box functionality
    setupComboBoxes();
    
    console.log('✅ Participant list initialization complete');
    
    // Update status indicator
    const statusElement = document.getElementById('componentStatus');
    if (statusElement) {
        statusElement.innerHTML = '✅ Component ready - Search and filters active';
        statusElement.style.color = 'green';
        
        // Hide status after 3 seconds
        setTimeout(() => {
            statusElement.style.display = 'none';
        }, 3000);
    }
}

// Performance-optimized data loading
async function loadParticipantData() {
    try {
        console.log('📦 Loading participant data with performance optimizations...');
        
        // Show skeleton loading
        showSkeletonLoading();
        
        if (!window.dataManager) {
            console.error('❌ DataManager not available');
            resetEmptyData();
            hideSkeletonLoading();
            return;
        }
        
        // Use performance monitor to track this operation
        if (window.performanceMonitor) {
            window.performanceMonitor.trackOperation('participant_data_load', async () => {
                await loadDataWithOptimizations();
            });
        } else {
            await loadDataWithOptimizations();
        }
        
    } catch (error) {
        console.error('❌ Error loading participant data:', error);
        resetEmptyData();
    } finally {
        hideSkeletonLoading();
    }
}

// Optimized data loading implementation
async function loadDataWithOptimizations() {
    // Batch data requests
    const [participantsArray, eventsArray] = await Promise.all([
        Promise.resolve(window.dataManager.getParticipantsArray() || []),
        Promise.resolve(window.dataManager.getEventsArray() || [])
    ]);
    
    // Update global data
    allParticipants = window.allParticipants = participantsArray;
    allEvents = window.allEvents = eventsArray;
    filteredParticipants = window.filteredParticipants = [...allParticipants];
    
    console.log('📋 Loaded participants:', allParticipants.length);
    console.log('📅 Loaded events:', allEvents.length);
    
    // Build performance cache
    buildParticipantEventCache();
    
    // Update UI with batched operations
    requestAnimationFrame(() => {
        updateParticipantStats();
        renderParticipantTableOptimized();
    });
}

// Build cache for participant-event relationships
function buildParticipantEventCache() {
    console.log('🔄 Building participant-event cache...');
    const startTime = performance.now();
    
    performanceCache.participantEventMap.clear();
    
    // Build reverse lookup for better performance
    allParticipants.forEach(participant => {
        const registeredEvents = allEvents.filter(event => 
            event.participants && event.participants.includes(participant.id)
        );
        
        performanceCache.participantEventMap.set(participant.id, {
            events: registeredEvents,
            eventNames: registeredEvents.map(e => e.name).join(', ') || 'Not registered for any event'
        });
    });
    
    performanceCache.lastCacheUpdate = Date.now();
    
    const endTime = performance.now();
    console.log(`✅ Cache built in ${(endTime - startTime).toFixed(2)}ms for ${allParticipants.length} participants`);
}

// Check if cache needs refresh
function isCacheValid() {
    return (Date.now() - performanceCache.lastCacheUpdate) < performanceCache.cacheTTL;
}

// Reset empty data helper
function resetEmptyData() {
    allParticipants = window.allParticipants = [];
    allEvents = window.allEvents = [];
    filteredParticipants = window.filteredParticipants = [];
    performanceCache.participantEventMap.clear();
}

// Show skeleton loading
function showSkeletonLoading() {
    const tableBody = document.getElementById('participantsTableBody');
    const skeleton = document.getElementById('participantsSkeleton');
    const pagination = document.getElementById('participantsPagination');
    
    if (tableBody) tableBody.style.display = 'none';
    if (skeleton) {
        skeleton.innerHTML = UIComponents.createSkeletonCards(8, 'table');
        skeleton.style.display = 'block';
    }
    if (pagination) pagination.style.display = 'none';
}

// Hide skeleton loading
function hideSkeletonLoading() {
    const tableBody = document.getElementById('participantsTableBody');
    const skeleton = document.getElementById('participantsSkeleton');
    const pagination = document.getElementById('participantsPagination');
    
    if (tableBody) tableBody.style.display = 'table-row-group';
    if (skeleton) skeleton.style.display = 'none';
    if (pagination) pagination.style.display = 'block';
}

// Debouncing for search and filters
let filterDebounceTimer = null;
const FILTER_DEBOUNCE_DELAY = 300; // ms

// Optimized participant filters with debouncing
function applyParticipantFiltersOptimized() {
    // Clear existing timer
    if (filterDebounceTimer) {
        clearTimeout(filterDebounceTimer);
    }
    
    // Debounce the filter operation
    filterDebounceTimer = setTimeout(() => {
        performFilterOperation();
    }, FILTER_DEBOUNCE_DELAY);
}

// Actual filter operation with performance optimizations
function performFilterOperation() {
    console.log('🔍 Applying optimized participant filters...');
    const startTime = performance.now();
    
    const searchTerm = document.getElementById('participantSearch')?.value.toLowerCase().trim() || '';
    const eventFilter = document.getElementById('eventFilter')?.value || '';
    const classFilter = document.getElementById('classFilter')?.value || '';
    const statusFilter = document.getElementById('statusFilter')?.value || '';
    
    // Use more efficient filtering with early returns
    filteredParticipants = allParticipants.filter(participant => {
        // Early return for search term (most expensive operation)
        if (searchTerm) {
            const nameMatch = participant.name?.toLowerCase().includes(searchTerm);
            const nicknameMatch = participant.nickname?.toLowerCase().includes(searchTerm);
            const numberMatch = participant.racingNumber?.toString().includes(searchTerm);
            
            if (!nameMatch && !nicknameMatch && !numberMatch) {
                return false;
            }
        }
        
        // Status filter (cheap operation)
        if (statusFilter && participant.status !== statusFilter) {
            return false;
        }
        
        // Class filter (moderate cost)
        if (classFilter) {
            const classes = participant.selectedClasses || [];
            if (!classes.includes(classFilter)) {
                return false;
            }
        }
        
        // Event filter (potentially expensive, use cache)
        if (eventFilter) {
            if (isCacheValid() && performanceCache.participantEventMap.has(participant.id)) {
                const cachedInfo = performanceCache.participantEventMap.get(participant.id);
                const isRegisteredForEvent = cachedInfo.events.some(event => event.id === eventFilter);
                if (!isRegisteredForEvent) {
                    return false;
                }
            } else {
                // Fallback to direct lookup
                const isRegisteredForEvent = allEvents.some(event => 
                    event.id === eventFilter && 
                    event.participants && 
                    event.participants.includes(participant.id)
                );
                if (!isRegisteredForEvent) {
                    return false;
                }
            }
        }
        
        return true;
    });
    
    // Update global state
    window.filteredParticipants = filteredParticipants;
    
    // Reset to first page when filters are applied
    currentPage = window.participantListCurrentPage = 1;
    
    const endTime = performance.now();
    console.log(`✅ Filters applied in ${(endTime - startTime).toFixed(2)}ms - ${filteredParticipants.length}/${allParticipants.length} participants`);
    
    // Update UI efficiently
    requestAnimationFrame(() => {
        updateParticipantStats();
        renderParticipantTableOptimized();
    });
}

// Keep original function name for backward compatibility with debouncing
function applyParticipantFilters() {
    applyParticipantFiltersOptimized();
}

// Optimized clear filters function
function clearFiltersOptimized() {
    console.log('🧹 Clearing all filters...');
    
    // Clear form inputs efficiently
    const inputs = [
        'participantSearch',
        'eventFilter',
        'classFilter',
        'statusFilter',
        'eventFilterInput',
        'classFilterInput'
    ];
    
    inputs.forEach(inputId => {
        const input = document.getElementById(inputId);
        if (input) input.value = '';
    });
    
    // Hide dropdowns
    const dropdowns = ['eventFilterDropdown', 'classFilterDropdown'];
    dropdowns.forEach(dropdownId => {
        const dropdown = document.getElementById(dropdownId);
        if (dropdown) dropdown.style.display = 'none';
    });
    
    // Reset filters without debouncing for immediate response
    filteredParticipants = [...allParticipants];
    window.filteredParticipants = filteredParticipants;
    currentPage = 1;
    
    // Update UI
    requestAnimationFrame(() => {
        updateParticipantStats();
        renderParticipantTableOptimized();
    });
}

// Keep original function name for compatibility
function clearFilters() {
    clearFiltersOptimized();
}

// Update participant statistics
function updateParticipantStats() {
    console.log('📊 Updating participant stats...');
    const totalCount = filteredParticipants.length;
    
    console.log('📊 Stats calculated:', { totalCount });
    
    const totalEl = document.getElementById('totalCount');
    
    console.log('📊 Stats elements found:', {
        total: !!totalEl
    });
    
    if (totalEl) totalEl.textContent = totalCount;
    
    
    console.log('✅ Stats updated successfully');
}

// Optimized table rendering with virtual scrolling
function renderParticipantTableOptimized() {
    console.log('🗂️ Rendering participant table with optimizations...');
    const tbody = document.getElementById('participantsTableBody');
    const paginationContainer = document.getElementById('participantsPagination');
    
    if (!tbody) {
        console.error('❌ Table body not found!');
        return;
    }
    
    // Use virtual scrolling for large datasets
    if (filteredParticipants.length > 100) {
        renderVirtualizedTable(tbody, paginationContainer);
        return;
    }
    
    // Standard rendering for smaller datasets
    renderStandardTable(tbody, paginationContainer);
}

// Virtual scrolling implementation for large datasets
function renderVirtualizedTable(tbody, paginationContainer) {
    console.log('🚀 Using virtual scrolling for', filteredParticipants.length, 'participants');
    
    // Calculate visible range
    const visibleCount = Math.ceil(virtualScrollConfig.containerHeight / virtualScrollConfig.rowHeight);
    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = Math.min(startIndex + itemsPerPage, filteredParticipants.length);
    
    // Update rendered range
    performanceCache.renderedRange = { start: startIndex, end: endIndex };
    
    // Create virtual rows efficiently
    const fragment = document.createDocumentFragment();
    const currentPageParticipants = filteredParticipants.slice(startIndex, endIndex);
    
    // Batch DOM operations
    currentPageParticipants.forEach((participant, index) => {
        const row = createOptimizedParticipantRow(participant, startIndex + index);
        fragment.appendChild(row);
    });
    
    // Single DOM update
    tbody.innerHTML = '';
    tbody.appendChild(fragment);
    
    // Render pagination efficiently
    renderOptimizedPagination(paginationContainer);
    
    console.log(`✅ Virtual table rendered: ${currentPageParticipants.length} rows`);
}

// Standard table rendering for smaller datasets
function renderStandardTable(tbody, paginationContainer) {
    if (filteredParticipants.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                    ${allParticipants.length === 0 ? 'No participants registered yet.' : 'No participants match the current filters.'}
                </td>
            </tr>
        `;
        if (paginationContainer) paginationContainer.innerHTML = '';
        return;
    }
    
    // Calculate pagination
    const totalPages = Math.ceil(filteredParticipants.length / itemsPerPage);
    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = startIndex + itemsPerPage;
    const currentPageParticipants = filteredParticipants.slice(startIndex, endIndex);
    
    // Batch create rows
    const fragment = document.createDocumentFragment();
    currentPageParticipants.forEach(participant => {
        const row = createOptimizedParticipantRow(participant);
        fragment.appendChild(row);
    });
    
    // Single DOM update
    tbody.innerHTML = '';
    tbody.appendChild(fragment);
    
    // Render pagination
    renderOptimizedPagination(paginationContainer);
}

// Create optimized participant row with caching
function createOptimizedParticipantRow(participant, rowIndex = null) {
    const row = document.createElement('tr');
    
    // Use cached event data if available
    let eventInfo;
    if (isCacheValid() && performanceCache.participantEventMap.has(participant.id)) {
        eventInfo = performanceCache.participantEventMap.get(participant.id);
    } else {
        // Fallback to direct lookup (will trigger cache rebuild)
        const registeredEvents = allEvents.filter(event => 
            event.participants && event.participants.includes(participant.id)
        );
        eventInfo = {
            events: registeredEvents,
            eventNames: registeredEvents.map(e => e.name).join(', ') || 'Not registered for any event'
        };
    }
    
    // Optimize class processing
    const classesText = (participant.selectedClasses || []).join(', ') || 'N/A';
    
    const status = participant.status || 'active';
    const statusClass = `status-${status}`;
    
    // Build row HTML efficiently
    row.innerHTML = `
        <td>
            <strong>${participant.name}</strong>
            ${participant.nickname ? `<br><small>(${participant.nickname})</small>` : ''}
        </td>
        <td>${participant.racingNumber ? `#${participant.racingNumber}` : 'N/A'}</td>
        <td>${classesText}</td>
        <td>${participant.totalFee ? `$${participant.totalFee.toFixed(2)}` : 'N/A'}</td>
        <td><span class="status-badge ${statusClass}">${status.charAt(0).toUpperCase() + status.slice(1)}</span></td>
        <td>
            <button class="btn btn-sm btn-primary" onclick="editParticipant('${participant.id}')" title="Edit Participant">
                <i class="fas fa-edit"></i> Edit
            </button>
            <button class="btn btn-sm btn-danger" onclick="deleteParticipant('${participant.id}')" title="Delete Participant">
                <i class="fas fa-trash"></i> Delete
            </button>
        </td>
    `;
    
    // Add virtual scroll index if needed
    if (rowIndex !== null) {
        row.dataset.virtualIndex = rowIndex;
    }
    
    return row;
}

// Optimized pagination rendering
function renderOptimizedPagination(paginationContainer) {
    if (!paginationContainer) return;
    
    const totalPages = Math.ceil(filteredParticipants.length / itemsPerPage);
    
    if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
    }
    
    // Use efficient pagination component
    paginationContainer.innerHTML = UIComponents.createPagination(
        currentPage, 
        totalPages, 
        filteredParticipants.length, 
        itemsPerPage, 
        'changeParticipantPageOptimized'
    );
}

// Optimized page change with performance tracking
function changeParticipantPageOptimized(page) {
    if (page < 1) return;
    
    const totalPages = Math.ceil(filteredParticipants.length / itemsPerPage);
    if (page > totalPages) return;
    
    currentPage = window.participantListCurrentPage = page;
    
    // Use performance monitoring if available
    if (window.performanceMonitor) {
        window.performanceMonitor.trackOperation('page_change', () => {
            return Promise.resolve(renderParticipantTableOptimized());
        });
    } else {
        renderParticipantTableOptimized();
    }
    
    // Smooth scroll to top
    const table = document.getElementById('participantsTable');
    if (table) {
        table.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

// Keep the old function name for backward compatibility
function changeParticipantPage(page) {
    changeParticipantPageOptimized(page);
}

// Edit participant function
function editParticipant(participantId) {
    console.log('📝 Opening edit form for participant:', participantId);
    
    try {
        const participant = window.dataManager.getParticipant(participantId);
        if (!participant) {
            alert('Participant not found');
            return;
        }
        
        // Create edit modal HTML
        const editModalHtml = createEditParticipantModal(participant);
        
        // Show the modal
        showEditModal('Edit Participant', editModalHtml);
        
        // Initialize form after modal is shown
        setTimeout(() => {
            initializeEditForm(participant);
        }, 100);
        
    } catch (error) {
        console.error('Error opening edit form:', error);
        alert('Error opening edit form. Please try again.');
    }
}

// Create edit participant modal HTML
function createEditParticipantModal(participant) {
    return `
        <div class="edit-participant-modal">
            <form id="editParticipantForm" class="edit-form">
                <input type="hidden" id="editParticipantId" value="${participant.id}">
                
                <!-- Driver Information -->
                <div class="form-section">
                    <h3>Driver Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="editName" value="${participant.name || ''}" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nickname</label>
                            <input type="text" class="form-control" id="editNickname" value="${participant.nickname || ''}" placeholder="Racing nickname">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Racing Number</label>
                            <input type="number" class="form-control" id="editRacingNumber" value="${participant.racingNumber || ''}" min="1" max="999" placeholder="Preferred racing number">

// Show edit modal
function showEditModal(title, content) {
    // Create modal overlay
    const overlay = document.createElement('div');
    overlay.id = 'editModalBackdrop';
    overlay.className = 'modal-overlay active';
    overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        z-index: 1000;
        overflow-y: auto;
        padding: 1rem;
    `;
    
    // Create modal content
    const modalContent = document.createElement('div');
    modalContent.className = 'modal-content';
    modalContent.style.cssText = `
        background: var(--bg-primary);
        border-radius: 8px;
        width: 100%;
        max-width: 1000px;
        margin: 2rem auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        position: relative;
        max-height: calc(100vh - 4rem);
        display: flex;
        flex-direction: column;
    `;
    
    modalContent.innerHTML = `
        <div class="modal-header" style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            border-radius: 8px 8px 0 0;
            flex-shrink: 0;
        ">
            <h2 style="color: var(--text-primary); margin: 0; font-size: 1.5rem;">${title}</h2>
            <button class="modal-close" onclick="closeEditModal()" style="
                background: none;
                border: none;
                font-size: 2rem;
                color: var(--text-secondary);
                cursor: pointer;
                padding: 0;
                width: 2rem;
                height: 2rem;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 4px;
                transition: background-color 0.2s ease;
            ">&times;</button>
        </div>
        <div class="modal-body" style="
            padding: 0;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        ">
            ${content}
        </div>
    `;
    
    overlay.appendChild(modalContent);
    document.body.appendChild(overlay);
    
    // Prevent body scroll
    document.body.style.overflow = 'hidden';
    
    // Add hover effect for close button
    const closeBtn = modalContent.querySelector('.modal-close');
    closeBtn.addEventListener('mouseenter', () => {
        closeBtn.style.background = 'var(--bg-primary)';
        closeBtn.style.color = 'var(--text-primary)';
    });
    closeBtn.addEventListener('mouseleave', () => {
        closeBtn.style.background = 'none';
        closeBtn.style.color = 'var(--text-secondary)';
    });
    
    // Add responsive styles
    if (window.innerWidth <= 768) {
        modalContent.style.margin = '1rem';
        modalContent.style.width = 'calc(100% - 2rem)';
        modalContent.querySelector('.modal-header').style.padding = '1rem';
    }
}

// Initialize edit form
function initializeEditForm(participant) {
    // Load available classes
    loadEditClassOptions(participant);
    
    // Load vehicle configurations
    loadEditVehicleConfigurations(participant);
    
    // Load available events
    loadEditEventOptions(participant);
    loadEditSponsors(participant);
    
    // Setup form submission
    const form = document.getElementById('editParticipantForm');
    if (form) {
        form.addEventListener('submit', handleEditFormSubmit);
    }
    
    // Add sponsor input event listener
    const sponsorInput = document.getElementById('editSponsorInput');
    if (sponsorInput) {
        sponsorInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addEditSponsor();
            }
        });
    }
}

// Load class options for editing
function loadEditClassOptions(participant) {
    const container = document.getElementById('editClassSelection');
    if (!container) return;
    
    // Get unique classes from all events and participants
    const allClasses = new Set();
    
    // Add classes from events
    allEvents.forEach(event => {
        if (event.classSettings) {
            event.classSettings.forEach(cls => {
                allClasses.add(cls.className || cls.name);
            });
        }
    });
    
    // Add classes from all participants
    allParticipants.forEach(p => {
        if (p.selectedClasses) {
            p.selectedClasses.forEach(cls => allClasses.add(cls));
        }
    });
    
    // Don't add default classes if none found - classes should come from events/series
    if (allClasses.size === 0) {
        console.log('No classes found from participants - classes should be configured in events/series');
    }
    
    const classOptionsHtml = Array.from(allClasses).sort().map(className => {
        const isSelected = participant.selectedClasses && participant.selectedClasses.includes(className);
        return `
            <div class="class-option ${isSelected ? 'selected' : ''}" data-class="${className}">
                <h5>${className}</h5>
                <div class="class-fee">$50.00</div>
                <div class="class-description">Racing class</div>
            </div>
        `;
    }).join('');
    
    container.innerHTML = classOptionsHtml;
    
    // Add event listeners for class selection changes
    const classOptionElements = container.querySelectorAll('.class-option');
    classOptionElements.forEach(option => {
        option.addEventListener('click', () => {
            const className = option.dataset.class;
            toggleEditClass(className);
        });
    });
}

// Load event options for editing
function loadEditEventOptions(participant) {
    const container = document.getElementById('editEventSelection');
    if (!container) return;
    
    // Get participant's current events
    const participantEvents = [];
    if (participant.eventId) {
        participantEvents.push(participant.eventId);
    }
    
    // Check if participant is in multiple events based on event participant lists
    allEvents.forEach(event => {
        if (event.participants && event.participants.includes(participant.id)) {
            if (!participantEvents.includes(event.id)) {
                participantEvents.push(event.id);
            }
        }
    });
    
    if (allEvents.length === 0) {
        container.innerHTML = '<div class="no-events">No events available for assignment.</div>';
        return;
    }
    
    const eventOptions = allEvents.map(event => {
        const isSelected = participantEvents.includes(event.id);
        const eventDate = event.date ? new Date(event.date).toLocaleDateString() : 'Date TBD';
        const eventStatus = event.status || 'active';
        const eventLocation = event.location || 'Location TBD';
        
        return `
            <div class="event-option ${isSelected ? 'selected' : ''}" data-event-id="${event.id}" onclick="toggleEditEvent('${event.id}')">
                <input type="checkbox" class="event-checkbox" ${isSelected ? 'checked' : ''} onchange="toggleEditEvent('${event.id}')">
                <div class="event-name">${event.name}</div>
                <div class="event-details">📅 ${eventDate}</div>
                <div class="event-details">📍 ${eventLocation}</div>
                <div class="event-status ${eventStatus}">${eventStatus.charAt(0).toUpperCase() + eventStatus.slice(1)}</div>
            </div>
        `;
    }).join('');
    
    container.innerHTML = eventOptions;
}

// Load vehicle configurations for editing
function loadEditVehicleConfigurations(participant) {
    const container = document.getElementById('editVehicleConfigurations');
    if (!container) return;
    
    // Clear existing configurations
    container.innerHTML = '';
    
    // Load configurations for each selected class
    if (participant.selectedClasses) {
        participant.selectedClasses.forEach(className => {
            addEditVehicleConfig(className, participant);
        });
    }
}

// Add vehicle configuration for a class
function addEditVehicleConfig(className, participant) {
    const container = document.getElementById('editVehicleConfigurations');
    if (!container) return;
    
    // Check if configuration already exists
    if (document.getElementById(`edit-vehicle-config-${className.replace(/\s+/g, '-')}`)) {
        return;
    }
    
    // Get existing configuration or create default
    const existingConfig = participant.sledConfigurations?.[className] || {};
    
    const configDiv = document.createElement('div');
    configDiv.className = 'vehicle-config';
    configDiv.id = `edit-vehicle-config-${className.replace(/\s+/g, '-')}`;
    
    configDiv.innerHTML = `
        <h4>🏁 Vehicle Configuration for ${className}</h4>
        <div class="vehicle-config-grid">
            <div class="form-group">
                <label class="form-label">Vehicle Make</label>
                <input type="text" class="form-control" id="edit_vehicle_${className.replace(/\s+/g, '_')}_make" 
                       value="${existingConfig.make || ''}" placeholder="e.g., Brand A, Brand B, Brand C">
            </div>
            <div class="form-group">
                <label class="form-label">Vehicle Model</label>
                <input type="text" class="form-control" id="edit_vehicle_${className.replace(/\s+/g, '_')}_model" 
                       value="${existingConfig.model || ''}" placeholder="e.g., Model X, Model Y, Model Z">
            </div>
            <div class="form-group">
                <label class="form-label">Vehicle Year</label>
                <input type="number" class="form-control" id="edit_vehicle_${className.replace(/\s+/g, '_')}_year" 
                       value="${existingConfig.year || ''}" min="1990" max="2025" placeholder="e.g., 2023">
            </div>
            <div class="form-group">
                <label class="form-label">Engine</label>
                <input type="text" class="form-control" id="edit_vehicle_${className.replace(/\s+/g, '_')}_engine" 
                       value="${existingConfig.engine || ''}" placeholder="e.g., V8, 4-cylinder, Electric">
            </div>
        </div>
    `;
    
    container.appendChild(configDiv);
}

// Remove vehicle configuration for a class
function removeEditVehicleConfig(className) {
    const configDiv = document.getElementById(`edit-vehicle-config-${className.replace(/\s+/g, '-')}`);
    if (configDiv) {
        configDiv.remove();
    }
}

// Toggle class selection and handle vehicle configuration
function toggleEditClass(className) {
    const option = document.querySelector(`#editClassSelection .class-option[data-class="${className}"]`);
    if (!option) return;
    
    const isSelected = option.classList.contains('selected');
    
    if (isSelected) {
        option.classList.remove('selected');
        removeEditVehicleConfig(className);
    } else {
        option.classList.add('selected');
        // Get participant data from the hidden input
        const participantId = document.getElementById('editParticipantId').value;
        const participant = allParticipants.find(p => p.id === participantId);
        addEditVehicleConfig(className, participant);
    }
}

// Load sponsors for editing
function loadEditSponsors(participant) {
    const container = document.getElementById('editSponsorTags');
    if (!container) return;
    
    // Clear existing sponsors
    container.innerHTML = '';
    
    // Load existing sponsors from participant data
    const existingSponsors = participant.sponsors || [];
    existingSponsors.forEach(sponsor => {
        addEditSponsorTag(sponsor);
    });
}

// Add sponsor in edit form
window.addEditSponsor = function() {
    const input = document.getElementById('editSponsorInput');
    const sponsorName = input.value.trim();
    
    if (sponsorName) {
        addEditSponsorTag(sponsorName);
        input.value = '';
        input.focus();
    }
};

// Add sponsor tag to edit form
function addEditSponsorTag(sponsorName) {
    const container = document.getElementById('editSponsorTags');
    if (!container) return;
    
    // Check if sponsor already exists
    const existingTags = container.querySelectorAll('.sponsor-tag span:first-child');
    const sponsorExists = Array.from(existingTags).some(tag => tag.textContent === sponsorName);
    
    if (!sponsorExists) {
        const tag = document.createElement('div');
        tag.className = 'sponsor-tag';
        tag.innerHTML = `
            <span>${sponsorName}</span>
            <span class="remove-icon" onclick="removeEditSponsor('${sponsorName}')">&times;</span>
        `;
        container.appendChild(tag);
    }
};

// Remove sponsor from edit form
window.removeEditSponsor = function(sponsorName) {
    const container = document.getElementById('editSponsorTags');
    if (!container) return;
    
    const tags = container.querySelectorAll('.sponsor-tag');
    tags.forEach(tag => {
        const sponsorSpan = tag.querySelector('span:first-child');
        if (sponsorSpan && sponsorSpan.textContent === sponsorName) {
            tag.remove();
        }
    });
};

// Toggle class selection in edit form
window.toggleEditClass = function(className) {
    const classOption = document.querySelector(`[data-class="${className}"]`);
    if (!classOption) return;
    
    classOption.classList.toggle('selected');
};

// Toggle event selection in edit form
window.toggleEditEvent = function(eventId) {
    const eventOption = document.querySelector(`[data-event-id="${eventId}"]`);
    const checkbox = eventOption.querySelector('.event-checkbox');
    if (!eventOption || !checkbox) return;
    
    eventOption.classList.toggle('selected');

};

// Handle edit form submission
async function handleEditFormSubmit(event) {
    event.preventDefault();
    
    try {
        const participantId = document.getElementById('editParticipantId').value;
        
        // Gather form data
        const selectedClassElements = document.querySelectorAll('.class-option.selected');
        const selectedClasses = Array.from(selectedClassElements).map(el => el.dataset.class);
        
        // Collect vehicle configurations
        const vehicleConfigurations = {};
        selectedClasses.forEach(className => {
            const classId = className.replace(/\s+/g, '_');
            vehicleConfigurations[className] = {
                make: document.getElementById(`edit_vehicle_${classId}_make`)?.value || '',
                model: document.getElementById(`edit_vehicle_${classId}_model`)?.value || '',
                year: document.getElementById(`edit_vehicle_${classId}_year`)?.value || '',
                engine: document.getElementById(`edit_vehicle_${classId}_engine`)?.value || ''
            };
        });
        
        const selectedEventElements = document.querySelectorAll('.event-option.selected');
        const selectedEvents = Array.from(selectedEventElements).map(el => el.dataset.eventId);
        
        // Gather sponsors from tags
        const sponsorTags = document.querySelectorAll('#editSponsorTags .sponsor-tag span:first-child');
        const sponsors = Array.from(sponsorTags).map(tag => tag.textContent);
        
        const updatedData = {
            name: document.getElementById('editName').value.trim(),
            nickname: document.getElementById('editNickname').value.trim(),
            racingNumber: document.getElementById('editRacingNumber').value ? parseInt(document.getElementById('editRacingNumber').value) : null,
            dob: document.getElementById('editDob').value,
            contact: {
                email: document.getElementById('editEmail').value.trim(),
                phone: document.getElementById('editPhone').value.trim(),
                emergency: document.getElementById('editEmergencyContact').value.trim()
            },
            sponsors: sponsors,
            selectedClasses: selectedClasses,
            sledConfigurations: vehicleConfigurations, // Add vehicle configurations
            selectedEvents: selectedEvents, // Multiple events support
            eventId: selectedEvents.length > 0 ? selectedEvents[0] : null, // Keep backward compatibility
            status: document.getElementById('editStatus').value,
            totalFee: parseFloat(document.getElementById('editTotalFee').value) || 0
        };
        
        // Validate required fields
        if (!updatedData.name || !updatedData.dob) {
            alert('Please fill in all required fields (Name and Date of Birth).');
            return;
        }
        
        if (selectedClasses.length === 0) {
            alert('Please select at least one racing class.');
            return;
        }
        
        if (selectedEvents.length === 0) {
            alert('Please select at least one event.');
            return;
        }
        
        console.log('💾 Updating participant:', participantId, updatedData);
        
        // Update participant using DataManager
        const success = await window.dataManager.updateParticipant(participantId, updatedData);
        
        if (success) {
            // Register participant for all selected events
            for (const eventId of selectedEvents) {
                try {
                    await window.dataManager.registerParticipantForEvent(eventId, participantId);
                } catch (error) {
                    console.warn(`Failed to register participant for event ${eventId}:`, error);
                }
            }
            
            const eventCount = selectedEvents.length;
            const eventText = eventCount === 1 ? 'event' : 'events';
            alert(`Participant updated successfully! Registered for ${eventCount} ${eventText}.`);
            closeEditModal();
            
            // Refresh participant list
            loadParticipantData();
        } else {
            alert('Failed to update participant. Please try again.');
        }
        
    } catch (error) {
        console.error('Error updating participant:', error);
        alert('Error updating participant: ' + error.message);
    }
}

// Delete participant function
function deleteParticipant(participantId) {
    if (!confirm('Are you sure you want to delete this participant? This action cannot be undone.')) {
        return;
    }
    
    try {
        // Remove from data manager
        if (window.dataManager) {
            window.dataManager.deleteParticipant(participantId);
        }
        
        // Reload the participant list
        loadParticipantData();
        
        // Show success message
        alert('Participant deleted successfully!');
    } catch (error) {
        console.error('Error deleting participant:', error);
        alert('Error deleting participant. Please try again.');
    }
}

// Setup individual combo box
function setupComboBox(inputId, dropdownId, hiddenInputId, onSelectCallback) {
    const input = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    const hiddenInput = document.getElementById(hiddenInputId);
    
    if (!input || !dropdown || !hiddenInput) {
        console.warn(`⚠️ Missing elements for combo box: ${inputId}, ${dropdownId}, ${hiddenInputId}`);
        return;
    }
    
    // Show dropdown on focus
    input.addEventListener('focus', () => {
        dropdown.style.display = 'block';
    });
    
    // Filter options on input
    input.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        filterComboOptions(dropdown, searchTerm);
    });
    
    // Handle option selection
    dropdown.addEventListener('click', (e) => {
        if (e.target.classList.contains('combo-option')) {
            const value = e.target.getAttribute('data-value');
            const label = e.target.textContent;
            updateComboSelection(input, hiddenInput, value, label);
            dropdown.style.display = 'none';
            
            // Trigger filter update
            if (typeof window[onSelectCallback] === 'function') {
                window[onSelectCallback](value, label);
            } else {
                applyParticipantFiltersOptimized();
            }
        }
    });
    
    // Hide dropdown when clicking outside
    document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.style.display = 'none';
        }
    });
}

// Filter combo box options
function filterComboOptions(dropdown, searchTerm) {
    const options = dropdown.querySelectorAll('.combo-option');
    let hasVisibleOptions = false;
    
    options.forEach(option => {
        const label = option.textContent.toLowerCase();
        if (label.includes(searchTerm)) {
            option.style.display = 'block';
            hasVisibleOptions = true;
        } else {
            option.style.display = 'none';
        }
    });
    
    // Show/hide no results message
    let noResults = dropdown.querySelector('.combo-no-results');
    if (!hasVisibleOptions) {
        if (!noResults) {
            noResults = document.createElement('div');
            noResults.className = 'combo-option combo-no-results';
            noResults.textContent = 'No results found';
            dropdown.appendChild(noResults);
        }
        noResults.style.display = 'block';
    } else if (noResults) {
        noResults.style.display = 'none';
    }
}

// Update combo box selection
function updateComboSelection(input, hiddenInput, value, label) {
    input.value = label;
    hiddenInput.value = value;
}

// Load event options for filter dropdown
function loadEventOptions() {
    console.log('📅 Loading event options for filter...');
    
    const dropdown = document.getElementById('eventFilterDropdown');
    if (!dropdown) {
        console.warn('⚠️ Event filter dropdown not found');
        return;
    }
    
    // Clear existing options except "All Events"
    const allEventsOption = dropdown.querySelector('.combo-option[data-value=""]');
    dropdown.innerHTML = '';
    if (allEventsOption) {
        dropdown.appendChild(allEventsOption);
    } else {
        const allEventsDiv = document.createElement('div');
        allEventsDiv.className = 'combo-option';
        allEventsDiv.setAttribute('data-value', '');
        allEventsDiv.textContent = 'All Events';
        dropdown.appendChild(allEventsDiv);
    }
    
    // Add event options
    if (allEvents && allEvents.length > 0) {
        allEvents.forEach(event => {
            const eventDiv = document.createElement('div');
            eventDiv.className = 'combo-option';
            eventDiv.setAttribute('data-value', event.id);
            eventDiv.textContent = event.name;
            dropdown.appendChild(eventDiv);
        });
    }
    
    console.log(`✅ Loaded ${allEvents?.length || 0} event options`);
}

// Load class options for filter dropdown
function loadClassOptions() {
    console.log('🏁 Loading class options for filter...');
    
    const dropdown = document.getElementById('classFilterDropdown');
    if (!dropdown) {
        console.warn('⚠️ Class filter dropdown not found');
        return;
    }
    
    // Clear existing options except "All Classes"
    const allClassesOption = dropdown.querySelector('.combo-option[data-value=""]');
    dropdown.innerHTML = '';
    if (allClassesOption) {
        dropdown.appendChild(allClassesOption);
    } else {
        const allClassesDiv = document.createElement('div');
        allClassesDiv.className = 'combo-option';
        allClassesDiv.setAttribute('data-value', '');
        allClassesDiv.textContent = 'All Classes';
        dropdown.appendChild(allClassesDiv);
    }
    
    // Get unique classes from all participants
    const allClasses = new Set();
    if (allParticipants && allParticipants.length > 0) {
        allParticipants.forEach(participant => {
            if (participant.selectedClasses && Array.isArray(participant.selectedClasses)) {
                participant.selectedClasses.forEach(className => {
                    if (className) allClasses.add(className);
                });
            }
        });
    }
    
    // Add class options
    Array.from(allClasses).sort().forEach(className => {
        const classDiv = document.createElement('div');
        classDiv.className = 'combo-option';
        classDiv.setAttribute('data-value', className);
        classDiv.textContent = className;
        dropdown.appendChild(classDiv);
    });
    
    console.log(`✅ Loaded ${allClasses.size} class options`);
}
