<template id="registration-form">
    <form id="participantRegistrationForm" class="registration-form">
        <!-- Horizontal Layout - All sections side by side -->
        <div class="form-horizontal-layout">
            <!-- Left Column: Driver Information + Actions -->
            <div class="form-column">
                <div class="form-section">
                    <h3>Driver Information</h3>
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nickname</label>
                        <input type="text" class="form-control" name="nickname" placeholder="Racing nickname">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Racing Number *</label>
                        <input type="text" class="form-control" name="racingNumber" required pattern="[A-Za-z0-9]+" placeholder="e.g., 1, 1A, 99B" title="Racing number can contain numbers and letters">
                        <small class="form-text">Required. Can contain numbers and letters. Must be unique per class in this event.</small>
                        <div id="racingNumberWarning" class="warning-message" style="display: none; margin-top: 0.5rem; padding: 0.5rem; background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 4px; color: #856404;">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span id="warningText"></span>
                        </div>
                        <div id="racingNumberSuggestions" class="suggestions" style="display: none; margin-top: 0.5rem;">
                            <small class="text-muted">Suggested available numbers: <span id="suggestedNumbers"></span></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date of Birth *</label>
                        <input type="date" class="form-control" name="dob" required>
                    </div>
                </div>

                <!-- Form Actions - Under Driver Information -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Submit Registration</button>
                    <button type="reset" class="btn btn-secondary">Reset Form</button>
                </div>
            </div>

            <!-- Middle Column: Contact Information + Sponsors -->
            <div class="form-column">
                <div class="form-section">
                    <h3>Contact Information</h3>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="contact.email" placeholder="your.email@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-control" name="contact.phone" placeholder="(555) 123-4567">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Emergency Contact</label>
                        <input type="text" class="form-control" name="contact.emergency" placeholder="Emergency contact name and phone">
                    </div>
                </div>

                <div class="form-section">
                    <h3>Sponsors</h3>
                    <div class="form-group">
                        <div class="sponsor-input-container">
                            <input type="text" class="form-control sponsor-input" id="sponsorInput" placeholder="Enter sponsor name and press Enter">
                            <button type="button" class="btn btn-secondary sponsor-add-btn" onclick="addSponsor()">Add</button>
                        </div>
                        <div class="sponsor-tags" id="sponsorTags">
                            <!-- Sponsor tags will be added here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Racing Classes & Payment Summary -->
            <div class="form-column">
                <div class="form-section">
                    <h3>Racing Classes *</h3>
                    <div class="form-group">
                        <div id="sledClassesContainer" class="classes-container">
                            <!-- Classes will be populated dynamically from series data -->
                        </div>
                    </div>
                </div>

                <div class="form-section payment-summary">
                    <h3>Payment Summary</h3>
                    <div class="payment-details">
                        <div class="payment-breakdown" id="paymentBreakdown">
                            <!-- Payment breakdown will be populated here -->
                        </div>
                        <div class="payment-total">
                            <strong>Total Amount: $<span id="totalAmount">0.00</span></strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vehicle Configurations - Full Width Below -->
        <div id="sledConfigContainer" class="sled-config-container">
            <!-- Vehicle configurations for selected classes will appear here -->
        </div>
    </form>
</template>

<script>
// Registration form functionality
let selectedClasses = new Set();
let classFees = {};
let currentSeries = null;
let sponsors = new Set();

// Initialize form when component loads
function initializeRegistrationForm() {
    console.log('Initializing registration form...');
    
    // Wait for DOM elements to be available
    const checkElements = () => {
        const form = document.getElementById('participantRegistrationForm');
        const container = document.getElementById('sledClassesContainer');
        
        if (form && container) {
            console.log('Form elements found, proceeding with initialization');
            loadSeriesData();
            setupEventListeners();
            updatePaymentSummary(); // Initialize payment summary
            return true;
        }
        return false;
    };
    
    if (!checkElements()) {
        console.log('Form elements not ready, waiting...');
        // If elements aren't ready, wait a bit and try again
        setTimeout(() => {
            if (!checkElements()) {
                console.log('Elements still not ready, trying once more...');
                setTimeout(checkElements, 200);
            }
        }, 100);
    }
}

function loadSeriesData() {
    console.log('Loading series data...');
    // This will be populated from the parent page with series data
    if (window.currentSeries) {
        console.log('Found window.currentSeries:', window.currentSeries);
        currentSeries = window.currentSeries;
        populateClasses();
    } else {
        console.log('No window.currentSeries found, no default classes will be provided');
        // Don't use default classes if no series data is available
        currentSeries = {
            name: 'No Event Selected',
            classes: []
        };
        populateClasses();
    }
}

function populateClasses() {
    console.log('Populating classes...');
    const container = document.getElementById('sledClassesContainer');
    
    if (!container) {
        console.warn('Classes container not found');
        return;
    }
    
    if (!currentSeries || !currentSeries.classes) {
        console.warn('No series data or classes available:', currentSeries);
        return;
    }
    
    console.log('Populating with classes:', currentSeries.classes);
    container.innerHTML = '';
    
    currentSeries.classes.forEach(classInfo => {
        const fee = classInfo.fee || 50; // Default fee if not specified
        classFees[classInfo.name] = fee;
        
        const classDiv = document.createElement('div');
        classDiv.className = 'class-option';
        classDiv.innerHTML = `
            <label>
                <input type="checkbox" name="selectedClasses" value="${classInfo.name}" 
                       onchange="handleClassSelection('${classInfo.name}', this.checked)">
                ${classInfo.name}
            </label>
            <span class="class-fee">$${fee}</span>
        `;
        container.appendChild(classDiv);
    });
    
    console.log('Classes populated successfully');
}

function handleClassSelection(className, isSelected) {
    if (isSelected) {
        selectedClasses.add(className);
        createVehicleConfig(className);
    } else {
        selectedClasses.delete(className);
        removeVehicleConfig(className);
    }
    
    updateClassOptionStyles();
    updatePaymentSummary();
}

function updateClassOptionStyles() {
    document.querySelectorAll('.class-option').forEach(option => {
        const checkbox = option.querySelector('input[type="checkbox"]');
        let isSelected = false;

        if (checkbox) {
            // Standard component rendering includes a checkbox
            isSelected = !!checkbox.checked;
        } else {
            // Fallback for pages that render class options without checkboxes
            // Try to infer selection from the local selectedClasses Set or existing class
            try {
                const label = option.querySelector('label');
                const inferredName = label ? (label.textContent || '').trim() : option.getAttribute('data-class-name');
                if (inferredName && typeof selectedClasses !== 'undefined' && selectedClasses instanceof Set) {
                    isSelected = selectedClasses.has(inferredName);
                } else {
                    // Last resort: keep current selected state if present
                    isSelected = option.classList.contains('selected');
                }
            } catch (e) {
                isSelected = option.classList.contains('selected');
            }
        }

        option.classList.toggle('selected', isSelected);
    });
}

// Sponsor management functions
function addSponsor() {
    const input = document.getElementById('sponsorInput');
    const sponsorName = input.value.trim();
    
    if (sponsorName && !sponsors.has(sponsorName)) {
        sponsors.add(sponsorName);
        renderSponsorTags();
        input.value = '';
        input.focus();
    }
}

function removeSponsor(sponsorName) {
    sponsors.delete(sponsorName);
    renderSponsorTags();
}

function renderSponsorTags() {
    const container = document.getElementById('sponsorTags');
    container.innerHTML = '';
    
    sponsors.forEach(sponsor => {
        const tag = document.createElement('div');
        tag.className = 'sponsor-tag';
        tag.innerHTML = `
            <span>${sponsor}</span>
            <span class="remove-icon" onclick="removeSponsor('${sponsor}')">&times;</span>
        `;
        container.appendChild(tag);
    });
}

function createVehicleConfig(className) {
    const container = document.getElementById('sledConfigContainer');
    
    const configDiv = document.createElement('div');
    configDiv.className = 'vehicle-config';
    configDiv.id = `vehicle-config-${className.replace(/\s+/g, '-')}`;
    
    configDiv.innerHTML = `
        <h4>🏁 Vehicle Configuration for ${className}</h4>
        <div class="vehicle-config-grid">
            <div class="form-group">
                <label class="form-label">Vehicle Make</label>
                <input type="text" class="form-control" name="vehicle_${className}_make" 
                                               placeholder="e.g., Brand A, Brand B, Brand C">
            </div>
            <div class="form-group">
                <label class="form-label">Vehicle Model</label>
                <input type="text" class="form-control" name="vehicle_${className}_model" 
                       placeholder="e.g., Model X, Model Y, Model Z">
            </div>
            <div class="form-group">
                <label class="form-label">Vehicle Year</label>
                <input type="number" class="form-control" name="vehicle_${className}_year" 
                       min="1990" max="2025" placeholder="e.g., 2023">
            </div>
            <div class="form-group">
                <label class="form-label">Engine</label>
                <input type="text" class="form-control" name="vehicle_${className}_engine" 
                       placeholder="e.g., V8, 4-cylinder, Electric">
            </div>
        </div>
    `;
    
    container.appendChild(configDiv);
}

function removeVehicleConfig(className) {
    const configDiv = document.getElementById(`vehicle-config-${className.replace(/\s+/g, '-')}`);
    if (configDiv) {
        configDiv.remove();
    }
}

function updatePaymentSummary() {
    const breakdownContainer = document.getElementById('paymentBreakdown');
    const totalElement = document.getElementById('totalAmount');
    
    let total = 0;
    let breakdownHTML = '';
    
    selectedClasses.forEach(className => {
        const fee = classFees[className] || 50;
        total += fee;
        breakdownHTML += `
            <div class="payment-item">
                <span>${className}</span>
                <span>$${fee.toFixed(2)}</span>
            </div>
        `;
    });
    
    if (selectedClasses.size === 0) {
        breakdownHTML = '<div class="payment-item"><span>No classes selected</span><span>$0.00</span></div>';
    }
    
    breakdownContainer.innerHTML = breakdownHTML;
    totalElement.textContent = total.toFixed(2);
}

function setupEventListeners() {
    console.log('Setting up event listeners...');
    const form = document.getElementById('participantRegistrationForm');
    
    if (!form) {
        console.warn('Form not found for event listeners');
        return;
    }
    
    // Prevent duplicate event listeners
    if (form.hasAttribute('data-listeners-attached')) {
        console.log('Event listeners already attached, skipping...');
        return;
    }
    
    // Sponsor input event listener
    const sponsorInput = document.getElementById('sponsorInput');
    if (sponsorInput) {
        sponsorInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSponsor();
            }
        });
    }
    
         // Add duplicate detection only to name field (most important)
     const nameField = form.querySelector('input[name="name"]');
     if (nameField) {
         nameField.addEventListener('input', () => {
             setTimeout(() => {
                 if (window.checkFormForDuplicates) {
                     window.checkFormForDuplicates();
                 }
             }, 1500); // 1.5 second delay to reduce spam
         });
         nameField.addEventListener('blur', () => {
             if (window.checkFormForDuplicates) {
                 window.checkFormForDuplicates();
             }
         });
     }
    
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (selectedClasses.size === 0) {
            alert('Please select at least one racing class.');
            return;
        }
        
        try {
            const formData = new FormData(e.target);
            
            // Validate racing number
            const racingNumber = formData.get('racingNumber');
            if (!racingNumber || racingNumber.trim() === '') {
                alert('Racing number is required');
                return;
            }
            
            // Validate racing number format
            const racingNumberRegex = /^[A-Za-z0-9]+$/;
            if (!racingNumberRegex.test(racingNumber.trim())) {
                alert('Racing number can only contain letters and numbers');
                return;
            }
            
            // Collect vehicle information for each selected class
            const vehicleConfigurations = {};
            selectedClasses.forEach(className => {
                vehicleConfigurations[className] = {
                    make: formData.get(`vehicle_${className}_make`) || '',
                    model: formData.get(`vehicle_${className}_model`) || '',
                    year: formData.get(`vehicle_${className}_year`) || '',
                    engine: formData.get(`vehicle_${className}_engine`) || ''
                };
            });
            
            const participantData = {
                name: formData.get('name'),
                nickname: formData.get('nickname') || '',
                racingNumber: formData.get('racingNumber'),
                dob: formData.get('dob'),
                contact: {
                    email: formData.get('contact.email') || '',
                    phone: formData.get('contact.phone') || '',
                    emergency: formData.get('contact.emergency') || ''
                },
                sponsors: Array.from(sponsors),
                selectedClasses: Array.from(selectedClasses),
                vehicleConfigurations: vehicleConfigurations,
                totalFee: Array.from(selectedClasses).reduce((sum, className) => 
                    sum + (classFees[className] || 50), 0),
                registrationDate: new Date().toISOString()
            };

            // Use the global registration handler if available
            if (window.handleRegistrationData) {
                await window.handleRegistrationData(participantData);
            } else if (window.registrationManager) {
                await window.registrationManager.registerParticipant(participantData);
            } else {
                // Store locally if no registration manager
                console.log('Registration data:', participantData);
            }
            
            // Show success message
            alert(`Registration submitted successfully!\nTotal fee: $${participantData.totalFee.toFixed(2)}`);
            
            // Reset form
            e.target.reset();
            selectedClasses.clear();
            sponsors.clear();
            document.getElementById('sledConfigContainer').innerHTML = '';
            document.getElementById('sponsorTags').innerHTML = '';
            updatePaymentSummary();
            updateClassOptionStyles();
            
        } catch (error) {
            alert(`Registration failed: ${error.message}`);
        }
    });
    
    form.addEventListener('reset', () => {
        selectedClasses.clear();
        sponsors.clear();
        document.getElementById('sledConfigContainer').innerHTML = '';
        document.getElementById('sponsorTags').innerHTML = '';
        updatePaymentSummary();
        updateClassOptionStyles();
    });
    
    // Add racing number validation and duplicate name checking
    const racingNumberInput = form.querySelector('input[name="racingNumber"]');
    if (racingNumberInput) {
        racingNumberInput.addEventListener('input', () => checkRacingNumberAndDuplicates());
        racingNumberInput.addEventListener('blur', () => checkRacingNumberAndDuplicates());
    }
    
    // Mark that event listeners have been attached
    form.setAttribute('data-listeners-attached', 'true');
    console.log('✅ Event listeners attached to registration form');
}

// Initialize when the component is loaded
// Check if DOM is already loaded, if so initialize immediately
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeRegistrationForm);
} else {
    // DOM is already loaded, initialize immediately
    initializeRegistrationForm();
}

// Function to check for duplicate names and racing number conflicts
async function checkRacingNumberAndDuplicates() {
    const nameInput = document.querySelector('input[name="name"]');
    const racingNumberInput = document.querySelector('input[name="racingNumber"]');
    const warningDiv = document.getElementById('racingNumberWarning');
    const suggestionsDiv = document.getElementById('racingNumberSuggestions');
    const warningText = document.getElementById('warningText');
    const suggestedNumbers = document.getElementById('suggestedNumbers');
    
    if (!nameInput || !racingNumberInput || !warningDiv || !suggestionsDiv) return;
    
    const name = nameInput.value.trim();
    const racingNumber = racingNumberInput.value.trim();
    
    // Hide warnings initially
    warningDiv.style.display = 'none';
    suggestionsDiv.style.display = 'none';
    
    if (!name || !racingNumber) return;
    
    try {
        // Get current event ID from the page context
        const currentEventId = window.currentEventId || getCurrentEventId();
        if (!currentEventId) return;
        
        // Get all participants for this event
        const allParticipants = window.allParticipants || [];
        const eventParticipants = allParticipants.filter(p => p.eventId === currentEventId);
        
        // Check for duplicate names
        const duplicateNames = eventParticipants.filter(p => 
            p.name && p.name.toLowerCase() === name.toLowerCase()
        );
        
        if (duplicateNames.length > 0) {
            // Show warning about duplicate names
            warningDiv.style.display = 'block';
            warningText.textContent = `Another driver with the name "${name}" is already registered for this event. A unique racing number is required to distinguish between drivers.`;
            
            // Check if racing number is already taken
            const numberTaken = eventParticipants.some(p => 
                p.racingNumber && p.racingNumber.toString().toUpperCase() === racingNumber.toUpperCase()
            );
            
            if (numberTaken) {
                warningText.textContent += ` Racing number ${racingNumber} is already taken.`;
                
                // Show suggestions
                if (window.Helpers && window.Helpers.suggestRacingNumbers) {
                    const suggestions = window.Helpers.suggestRacingNumbers(
                        Array.from(selectedClasses), 
                        currentEventId, 
                        allParticipants, 
                        5
                    );
                    
                    if (suggestions.length > 0) {
                        suggestionsDiv.style.display = 'block';
                        suggestedNumbers.textContent = suggestions.join(', ');
                    }
                }
            }
        }
    } catch (error) {
        console.error('Error checking duplicates:', error);
    }
}

// Helper function to get current event ID
function getCurrentEventId() {
    // Try to get from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('eventId');
    
    if (eventId) return eventId;
    
    // Try to get from page context
    if (window.currentEvent && window.currentEvent.id) return window.currentEvent.id;
    
    // Try to get from registration manager
    if (window.registrationManager && window.registrationManager.currentEventId) {
        return window.registrationManager.currentEventId;
    }
    
    return null;
}

        initializeRegistrationForm();
    }
};
