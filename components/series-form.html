<template id="series-form">
    <div class="series-form">
        <div class="form-header">
            <div class="header-content">
                <h2 id="formTitle">Create New Series</h2>
                <p class="form-subtitle">Set up a new racing series with custom classes and seasons</p>
            </div>
            <button class="btn btn-close" id="closeForm">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form id="seriesForm" class="modern-form">
            <div class="form-section">
                <h3 class="section-title">
                    <i class="fas fa-info-circle"></i>
                    Basic Information
                </h3>
                
                <div class="form-group">
                    <label for="seriesName">Series Name *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-trophy input-icon"></i>
                        <input type="text" id="seriesName" name="name" required 
                               placeholder="e.g., Winter Championship 2024"
                               autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="seriesDescription">Description</label>
                    <div class="input-wrapper">
                        <i class="fas fa-align-left input-icon"></i>
                        <textarea id="seriesDescription" name="description" rows="3" 
                                  placeholder="Brief description of the series, goals, and format..."></textarea>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3 class="section-title">
                    <i class="fas fa-calendar-alt"></i>
                    Season Management
                </h3>
                <p class="section-description">Create seasons to organize events and track performance over time periods.</p>
                
                <div id="seasonsContainer">
                    <div class="seasons-empty">
                        <p>No seasons created yet. Add your first season to get started.</p>
                    </div>
                </div>
                
                <button type="button" class="btn btn-secondary btn-add" onclick="addSeasonRow()">
                    <i class="fas fa-plus"></i> Add Season
                </button>
            </div>

            <div class="form-section">
                <h3 class="section-title">
                    <i class="fas fa-flag-checkered"></i>
                    Racing Classes
                </h3>
                <p class="section-description">Configure racing classes for this series. Default fees can be customized for each event.</p>
                
                <div id="classesContainer">
                    <div class="classes-empty">
                        <p>No racing classes defined yet. Add classes to organize participants.</p>
                    </div>
                </div>
                
                <button type="button" class="btn btn-secondary btn-add" onclick="addClassRow()">
                    <i class="fas fa-plus"></i> Add Class
                </button>
            </div>

            <div class="form-section">
                <h3 class="section-title">
                    <i class="fas fa-book"></i>
                    Rules & Regulations
                </h3>
                <p class="section-description">Define the rules and regulations that govern this series.</p>
                
                <div class="form-group">
                    <label for="rules">Series Rules</label>
                    <div class="input-wrapper">
                        <i class="fas fa-gavel input-icon"></i>
                        <textarea id="rules" name="rules" rows="4" 
                                  placeholder="Enter series rules and regulations..."></textarea>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelBtn">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary" id="saveBtn">
                    <i class="fas fa-save"></i> Create Series
                </button>
            </div>
        </form>

        <div class="form-note">
            <div class="note-icon">
                <i class="fas fa-lightbulb"></i>
            </div>
            <div class="note-content">
                <h4>Pro Tip</h4>
                <p>After creating the series, you can add classes, set rules, and configure other settings. You can also edit these details later.</p>
            </div>
        </div>
    </div>

    <style>

            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            padding: 2rem;

            margin: 0 auto;
            border: 1px solid var(--border-color);
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .header-content {
            flex: 1;

        .form-header h2 {
            margin: 0 0 0.5rem 0;

            font-size: 1.75rem;
            font-weight: 700;
        }

            font-size: 1rem;

            border-radius: 12px;

        }

            display: flex;
            align-items: center;

            color: var(--text-primary);

        .section-title i {

        .note-content h4 {
            margin: 0 0 0.5rem 0;

        /* Responsive Design */
        @media (max-width: 768px) {

                flex-direction: column;

                align-self: flex-end;

                padding: 1.5rem;

                flex-direction: column;

        @media (max-width: 480px) {

                padding: 1rem;

            .form-header h2 {
                font-size: 1.5rem;

            .form-section {
                padding: 1rem;
            }
        }
    </style>

    <script>
        class SeriesForm extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.shadowRoot.innerHTML = document.querySelector('#series-form').innerHTML;
                this.seriesManager = null;
                this.seriesId = null;
            }

            connectedCallback() {
                this.seriesManager = new SeriesManager();
                this.setupEventListeners();
                this.initializePointsGrid();
            }

            setupEventListeners() {
                const form = this.shadowRoot.querySelector('#seriesForm');
                const closeBtn = this.shadowRoot.querySelector('#closeForm');
                const cancelBtn = this.shadowRoot.querySelector('#cancelBtn');

                form.addEventListener('submit', (e) => this.handleSubmit(e));
                closeBtn.addEventListener('click', () => this.close());
                cancelBtn.addEventListener('click', () => this.close());
            }

            initializePointsGrid() {
                const pointsRows = this.shadowRoot.querySelector('#pointsRows');
                pointsRows.innerHTML = '';

                // Create 15 rows for positions 1-15
                for (let i = 1; i <= 15; i++) {
                    const row = document.createElement('div');
                    row.className = 'points-row';
                    row.innerHTML = `
                        <span>${i}</span>
                        <input type="number" name="points_${i}" value="${this.getDefaultPoints(i)}" min="0" required>
                    `;
                    pointsRows.appendChild(row);
                }
            }

            getDefaultPoints(position) {
                const defaultPoints = {
                    1: 25, 2: 20, 3: 16, 4: 13, 5: 11,
                    6: 10, 7: 9, 8: 8, 9: 7, 10: 6,
                    11: 5, 12: 4, 13: 3, 14: 2, 15: 1
                };
                return defaultPoints[position] || 0;
            }

            async loadSeries(seriesId) {
                this.seriesId = seriesId;
                const series = this.seriesManager.getSeries(seriesId);
                
                if (series) {
                    this.shadowRoot.querySelector('#formTitle').textContent = 'Edit Series';
                    this.populateForm(series);
                }
            }

            populateForm(series) {
                const form = this.shadowRoot.querySelector('#seriesForm');
                form.name.value = series.name;
                form.description.value = series.description || '';
                form.startDate.value = series.startDate;
                form.endDate.value = series.endDate;
                form.status.value = series.status;
                form.rules.value = series.rules || '';

                // Populate points system
                if (series.pointsSystem) {
                    Object.entries(series.pointsSystem).forEach(([position, points]) => {
                        const input = form.querySelector(`input[name="points_${position}"]`);
                        if (input) input.value = points;
                    });
                }
            }

            async handleSubmit(e) {
                e.preventDefault();
                const formData = new FormData(e.target);
                const seriesData = {
                    name: formData.get('name'),
                    description: formData.get('description'),
                    startDate: formData.get('startDate'),
                    endDate: formData.get('endDate'),
                    status: formData.get('status'),
                    rules: formData.get('rules'),
                    pointsSystem: {}
                };

                // Collect points system data
                for (let i = 1; i <= 15; i++) {
                    const points = formData.get(`points_${i}`);
                    if (points) {
                        seriesData.pointsSystem[i] = parseInt(points);
                    }
                }

                try {
                    if (this.seriesId) {
                        // Update existing series
                        await this.seriesManager.updateSeries(this.seriesId, seriesData);
                    } else {
                        // Create new series
                        await this.seriesManager.createSeries(seriesData);
                    }
                    this.close();
                } catch (error) {
                    console.error('Error saving series:', error);
                    // TODO: Show error message to user
                }
            }

            close() {
                this.dispatchEvent(new CustomEvent('close'));
            }
        }

        customElements.define('series-form', SeriesForm);
    </script>
</template>
