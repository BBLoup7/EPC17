<template id="series-list">
    <div class="series-list">
        <div class="series-grid" id="seriesGrid">
            <!-- Series cards will be dynamically inserted here -->
        </div>
        
        <!-- Skeleton loading -->
        <div id="seriesSkeleton" class="skeleton-loading" style="display: none;">
            <!-- Skeleton cards will be populated by JavaScript -->
        </div>
        
        <!-- Pagination -->
        <div id="seriesPagination" class="pagination-container"></div>
        
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-content">
                <div class="empty-icon">
                    <i class="fas fa-trophy"></i>
                </div>
                <h3>No Series Created Yet</h3>
                <p>Create your first racing series to get started. Once created, you can add classes, configure settings, and manage events.</p>
                <button class="btn btn-primary" onclick="showCreateForm()">
                    <i class="fas fa-plus"></i> Create Your First Series
                </button>
            </div>
        </div>
    </div>

    <style>
        .series-list {
            padding: 0;
        }

        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
            align-items: start;
        }

        .series-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }

        .series-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-orange-warm), var(--accent-primary), var(--accent-purple));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .series-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(255, 140, 66, 0.2);
            border-color: var(--accent-orange-warm);
        }

        .series-card:hover::before {
            opacity: 1;
        }

        .series-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .series-card-header h3 {
            margin: 0;
            color: var(--accent-primary);
            font-size: 1.25rem;
            font-weight: 600;
            flex: 1;
            line-height: 1.3;
        }

        .series-status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .series-status.active {
            background: var(--accent-success);
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.3);
        }

        .series-status.upcoming {
            background: var(--accent-warning);
            color: #000;
            box-shadow: 0 4px 12px rgba(214, 158, 46, 0.3);
        }

        .series-status.completed {
            background: var(--accent-info);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .series-card-body {
            margin-bottom: 1.5rem;
        }

        .series-description {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .series-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.75rem;
            background: var(--bg-primary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .meta-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .meta-value {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.875rem;
        }

        .series-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .series-actions .btn {
            flex: 1;
            min-width: 120px;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .series-actions .btn:hover {
            transform: translateY(-2px);
        }

        .series-actions .btn-secondary {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .series-actions .btn-secondary:hover {
            border-color: var(--accent-orange-warm);
            color: var(--accent-orange-warm);
            background: rgba(255, 140, 66, 0.1);
        }

        .series-actions .btn-primary {
            background: linear-gradient(135deg, var(--accent-orange-warm), var(--accent-primary));
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 140, 66, 0.3);
        }

        .series-actions .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(255, 140, 66, 0.4);
        }

        /* Specific button styles */
        .btn-configure {
            background: linear-gradient(135deg, var(--accent-orange-warm), var(--accent-primary));
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 140, 66, 0.3);
        }

        .btn-configure:hover {
            box-shadow: 0 6px 20px rgba(255, 140, 66, 0.4);
            transform: translateY(-2px);
        }

        .btn-view {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-view:hover {
            border-color: var(--accent-orange-warm);
            color: var(--accent-orange-warm);
            background: rgba(255, 140, 66, 0.1);
            transform: translateY(-2px);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 2px dashed var(--border-color);
            margin: 2rem 0;
        }

        .empty-content {
            max-width: 500px;
            margin: 0 auto;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-orange-warm), var(--accent-primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 2rem;
            color: white;
        }

        .empty-state h3 {
            color: var(--text-primary);
            font-size: 1.75rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .empty-state .btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 3rem;
        }

        .pagination-container .btn {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-weight: 500;
            min-width: 44px;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .series-grid {
                grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
                gap: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            .series-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .series-card {
                padding: 1.5rem;
            }

            .series-card-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .series-status {
                align-self: flex-start;
            }

            .series-meta {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .series-actions {
                flex-direction: column;
            }

            .series-actions .btn {
                min-width: auto;
            }

            .empty-state {
                padding: 3rem 1.5rem;
            }

            .empty-icon {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }

            .empty-state h3 {
                font-size: 1.5rem;
            }

            .empty-state p {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .series-card {
                padding: 1rem;
            }

            .series-card-header h3 {
                font-size: 1.25rem;
            }

            .series-description {
                font-size: 0.9rem;
            }

            .empty-state {
                padding: 2rem 1rem;
            }
        }
    </style>

    <script>
        // Pagination variables
        let currentPage = 1;
        const itemsPerPage = 24; // 24 series per page as requested
        
        // Load and display series when component is loaded
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.seriesManager) {
                    loadSeriesList();
                }
            }, 200);
        });

        async function loadSeriesList() {
            const container = document.getElementById('seriesGrid');
            const emptyState = document.getElementById('emptyState');
            const skeleton = document.getElementById('seriesSkeleton');
            const pagination = document.getElementById('seriesPagination');
            
            if (!container || !window.seriesManager) return;
            
            // Show skeleton loading
            showSkeletonLoading();
            
            // Simulate loading delay for better UX
            await new Promise(resolve => setTimeout(resolve, 500));
            
            const allSeries = window.seriesManager.getAllSeries();
            
            hideSkeletonLoading();
            
            if (allSeries.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                if (pagination) pagination.style.display = 'none';
                return;
            }
            
            container.style.display = 'grid';
            emptyState.style.display = 'none';
            
            // Calculate pagination
            const totalPages = Math.ceil(allSeries.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentPageSeries = allSeries.slice(startIndex, endIndex);
            
            const seriesHtml = currentPageSeries.map(series => generateSeriesCardHtml(series)).join('');
            container.innerHTML = seriesHtml;
            
            // Render pagination
            if (pagination && totalPages > 1) {
                pagination.style.display = 'block';
                pagination.innerHTML = UIComponents.createPagination(
                    currentPage, 
                    totalPages, 
                    allSeries.length, 
                    itemsPerPage, 
                    'changeSeriesPage'
                );
            } else if (pagination) {
                pagination.style.display = 'none';
            }
        }

        // Show skeleton loading
        function showSkeletonLoading() {
            const container = document.getElementById('seriesGrid');
            const skeleton = document.getElementById('seriesSkeleton');
            const pagination = document.getElementById('seriesPagination');
            
            if (container) container.style.display = 'none';
            if (skeleton) {
                skeleton.innerHTML = UIComponents.createSkeletonCards(6, 'card');
                skeleton.style.display = 'block';
            }
            if (pagination) pagination.style.display = 'none';
        }

        // Hide skeleton loading
        function hideSkeletonLoading() {
            const container = document.getElementById('seriesGrid');
            const skeleton = document.getElementById('seriesSkeleton');
            const pagination = document.getElementById('seriesPagination');
            
            if (container) container.style.display = 'grid';
            if (skeleton) skeleton.style.display = 'none';
            if (pagination) pagination.style.display = 'block';
        }

        // Change series page
        function changeSeriesPage(page) {
            if (page < 1) return;
            
            const allSeries = window.seriesManager.getAllSeries();
            const totalPages = Math.ceil(allSeries.length / itemsPerPage);
            if (page > totalPages) return;
            
            currentPage = page;
            loadSeriesList();
            
            // Scroll to top of series list
            const seriesList = document.querySelector('.series-list');
            if (seriesList) {
                seriesList.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function generateSeriesCardHtml(series) {
            const createdDate = new Date(series.createdDate || series.createdAt).toLocaleDateString();
            
            return `
                <div class="series-card" data-series-id="${series.id}">
                    <div class="series-card-header">
                        <h3>${series.name}</h3>
                        <span class="series-status">Active</span>
                    </div>
                    
                    <div class="series-card-body">
                        ${series.description ? `
                            <div class="series-description">
                                ${series.description}
                            </div>
                        ` : ''}
                        
                        <div class="series-meta">
                            <div class="meta-item">
                                <span class="meta-label">Created:</span>
                                <span class="meta-value">${createdDate}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Events:</span>
                                <span class="meta-value">0</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Classes:</span>
                                <span class="meta-value">0</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Participants:</span>
                                <span class="meta-value">0</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="series-actions">
                        <div class="primary-actions">
                            <button class="btn btn-configure" onclick="configureSeries('${series.id}')">
                                <i class="fas fa-cog"></i> Configure
                            </button>
                            <button class="btn btn-delete btn-icon" onclick="deleteSeries('${series.id}')" title="Delete Series">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        <div class="secondary-actions">
                            <button class="btn btn-view" onclick="viewSeriesDetails('${series.id}')">
                                <i class="fas fa-eye"></i> View Details
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Global functions for series actions
        window.viewSeriesDetails = function(seriesId) {
            alert(`View details for series ${seriesId} - Feature coming soon!`);
        };

        window.deleteSeries = async function(seriesId) {
            console.log('🔥 DELETE SERIES CALLED:', seriesId);
            const series = window.seriesManager.getSeries(seriesId);
            console.log('🔍 Found series:', series);
            if (!series) return;
            
            console.log('🎯 Calling confirmDelete with:', series.name);
            console.log('🔧 confirmDelete function exists:', typeof window.confirmDelete);
            
            window.confirmDelete(series.name, async () => {
                console.log('✅ User confirmed series delete, proceeding...');
                try {
                    await window.seriesManager.deleteSeries(seriesId);
                    loadSeriesList();
                    
                    // Update stats
                    if (window.loadSeriesStats) {
                        window.loadSeriesStats();
                    }
                    
                    // Show success toast if available
                    if (window.showToast) {
                        window.showToast(`Series "${series.name}" deleted successfully`, 'success');
                    }
                    
                    console.log(`Series "${series.name}" deleted successfully`);
                } catch (error) {
                    console.error('Error deleting series:', error);
                    if (window.showToast) {
                        window.showToast('Error deleting series. Please try again.', 'error');
                    }
                    throw error; // Re-throw to show error in modal
                }
            });
        };

        // Make functions available globally
        window.loadSeriesList = loadSeriesList;
        window.changeSeriesPage = changeSeriesPage;
    </script>
</template>
